<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1280" height="720"></canvas>
    <script>
      const W = 1280,
        H = 720,
        cv = document.getElementById("c"),
        ctx = cv.getContext("2d"),
        OUT = "#161827";
      let seed = 1;
      const srand = (s) => {
        seed = s >>> 0 || 1;
      };
      const rnd = () => {
        seed ^= seed << 13;
        seed >>>= 0;
        seed ^= seed >> 17;
        seed ^= seed << 5;
        seed >>>= 0;
        return seed / 4294967296;
      };
      function hash(n) {
        n = n ^ 61 ^ (n >>> 16);
        n = n + (n << 3);
        n = n ^ (n >>> 4);
        n = Math.imul(n, 0x27d4eb2d);
        n = n ^ (n >>> 15);
        return (n >>> 0) / 4294967296;
      }
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v)),
        lerp = (a, b, t) => a + (b - a) * t,
        PI = Math.PI;
      const ease = (t) => {
        t = clamp(t, 0, 1);
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      };
      const backOut = (t) => {
        t = clamp(t, 0, 1);
        const c = 1.7;
        return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
      };
      let TL = null,
        SH = null,
        TT = 0,
        LT = 0,
        BO = 0;
      // ---------- primitives ----------
      function rr(x, y, w, h, r, f, st, lw) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        if (f) {
          ctx.fillStyle = f;
          ctx.fill();
        }
        if (st) {
          ctx.lineWidth = lw || 4;
          ctx.strokeStyle = st;
          ctx.stroke();
        }
      }
      function ci(x, y, r, f, st, lw) {
        ctx.beginPath();
        ctx.arc(x, y, Math.max(0.3, r), 0, 7);
        if (f) {
          ctx.fillStyle = f;
          ctx.fill();
        }
        if (st) {
          ctx.lineWidth = lw || 4;
          ctx.strokeStyle = st;
          ctx.stroke();
        }
      }
      function el(x, y, rx, ry, f, st, lw, rot = 0) {
        ctx.beginPath();
        ctx.ellipse(x, y, Math.max(0.3, rx), Math.max(0.3, ry), rot, 0, 7);
        if (f) {
          ctx.fillStyle = f;
          ctx.fill();
        }
        if (st) {
          ctx.lineWidth = lw || 4;
          ctx.strokeStyle = st;
          ctx.stroke();
        }
      }
      function po(p, f, st, lw) {
        ctx.beginPath();
        ctx.moveTo(p[0], p[1]);
        for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
        ctx.closePath();
        if (f) {
          ctx.fillStyle = f;
          ctx.fill();
        }
        if (st) {
          ctx.lineWidth = lw || 4;
          ctx.strokeStyle = st;
          ctx.lineJoin = "round";
          ctx.stroke();
        }
      }
      function ln(p, w, c) {
        ctx.beginPath();
        ctx.moveTo(p[0], p[1]);
        for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
        ctx.lineWidth = w;
        ctx.strokeStyle = c;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
      }
      function limb(p, w, c, ol = 5) {
        ln(p, w + ol * 2, OUT);
        ln(p, w, c);
      }
      function gr(x, y, w, h, c0, c1, horiz) {
        const g = horiz
          ? ctx.createLinearGradient(x, 0, x + w, 0)
          : ctx.createLinearGradient(0, y, 0, y + h);
        g.addColorStop(0, c0);
        g.addColorStop(1, c1);
        ctx.fillStyle = g;
        ctx.fillRect(x, y, w, h);
      }
      function glow(x, y, r, c, a = 1) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, c);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.globalAlpha = a;
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
        ctx.globalAlpha = 1;
      }
      function tx(s, x, y, sz, c, al = "center", w = "900") {
        ctx.font = `${w} ${sz}px Inter`;
        ctx.textAlign = al;
        ctx.textBaseline = "middle";
        ctx.fillStyle = c;
        ctx.fillText(s, x, y);
      }
      // ---------- characters ----------
      const LOOK = {
        eli: {
          skin: "#f4c9a3",
          top: "#1fb5a3",
          bot: "#34406a",
          hair: "#6b4630",
          hs: "short",
          glasses: 1,
          pillow: 1,
        },
        gus: {
          skin: "#eab08a",
          top: "#cf4436",
          bot: "#4a5670",
          hair: "#5a3a26",
          hs: "cap",
          capc: "#2d4f8a",
          beard: 1,
          wide: 1.28,
        },
        marco: {
          skin: "#d9a67c",
          top: "#27375e",
          bot: "#1c2644",
          hair: "#15161c",
          hs: "slick",
          tie: "#e04b3a",
          shirt: 1,
        },
        cap: {
          skin: "#f1c9aa",
          top: "#f4f4f0",
          bot: "#1c2644",
          hair: "#c2c2c2",
          hs: "chat",
          stache: "#c2c2c2",
          tie: "#1c2644",
          epa: 1,
        },
        ray: {
          skin: "#b98660",
          top: "#23252f",
          bot: "#23252f",
          hair: "#15161c",
          hs: "buzz",
          badge: 1,
        },
        sick: {
          skin: "#cdd6b5",
          top: "#6b7080",
          bot: "#474c5a",
          hair: "#34343a",
          hs: "short",
          sweat: 1,
          tie: "#7a3040",
          shirt: 1,
        },
        crew: {
          skin: "#eab08a",
          top: "#f4c41c",
          bot: "#2b3040",
          hair: "#3a2a20",
          hs: "muffs",
          vest: 1,
        },
        walt: {
          skin: "#f1c9aa",
          top: "#8d6fb8",
          bot: "#5a6a80",
          hair: "#d8d8d8",
          hs: "bald",
          glasses: 1,
        },
      };
      const PT = [
          "#e07b39",
          "#7b6fd0",
          "#3f9f5f",
          "#d0507a",
          "#4a90d9",
          "#c9a227",
          "#8d99ae",
        ],
        PH = ["#3a2a20", "#15161c", "#b9772a", "#8a8a8a", "#6b4630"],
        PS = ["#f4c9a3", "#d9a67c", "#b98660", "#8a5a3c", "#f6d7bd"],
        PHS = ["short", "long", "bald", "slick", "long"];
      function ch(o) {
        const zed = o.k[0] === "z",
          base = zed ? o.k.slice(1) || "pax" : o.k,
          c = o.ci || 0,
          t = TT,
          id = o.x * 0.013 + c * 1.7;
        const lk = LOOK[base] || {
          skin: PS[c % 5],
          top: PT[c % 7],
          bot: "#34406a",
          hair: PH[c % 5],
          hs: PHS[c % 5],
        };
        const s = o.s,
          f = o.f || 1,
          skin = zed ? "#8fb08a" : lk.skin,
          shade = zed ? "#76967a" : null,
          lw = Math.max(3, s * 0.035),
          wd = (lk.wide || 1) * 0.27 * s;
        const run = o.run && o.walk != null;
        let sw = 0,
          bob = 0;
        if (o.walk != null) {
          sw = Math.sin(o.walk);
          bob = -Math.abs(Math.cos(o.walk)) * (run ? 0.07 : 0.035) * s;
        }
        if (o.talk) bob += Math.sin(t * 9 + id) * 0.01 * s;
        if (zed && o.walk == null) bob += Math.sin(t * 2.3 + id) * 0.012 * s;
        ctx.save();
        ctx.translate(o.x, o.y);
        if (!o.sit && !o.lie)
          el(0, 5, 0.44 * s * (lk.wide || 1), 0.075 * s, "rgba(0,0,0,.28)");
        if (o.lie) {
          ctx.translate(0, -0.2 * s);
          ctx.rotate(1.4 * f);
        } else
          ctx.rotate(
            (run ? 0.16 : zed ? 0.09 : o.scared ? -0.04 : 0) * f +
              (zed ? Math.sin(t * 1.9 + id) * 0.03 : 0),
          );
        // legs
        if (!o.sit) {
          for (const sd of [-1, 1]) {
            const a = sw * sd * (run ? 0.36 : 0.2) * s,
              lift =
                Math.max(0, -sw * sd) *
                (run ? 0.2 : 0.08) *
                s *
                (o.walk != null ? 1 : 0),
              hx = sd * 0.12 * s,
              fx2 = hx + a * f;
            limb(
              [hx, -0.4 * s + bob, fx2, -0.06 * s - lift],
              0.17 * s,
              lk.bot,
              lw,
            );
            el(
              fx2 + f * 0.05 * s,
              -0.04 * s - lift,
              0.14 * s,
              0.075 * s,
              "#1d1f2b",
              OUT,
              lw,
            );
          }
        }
        const shY = -0.9 * s + bob,
          ARM = (sd, a1, a2, dir, item) => {
            const sx = sd * (wd - 0.03 * s),
              e = [
                sx + Math.sin(a1) * 0.25 * s * dir,
                shY + Math.cos(a1) * 0.25 * s,
              ],
              h = [
                e[0] + Math.sin(a2) * 0.25 * s * dir,
                e[1] + Math.cos(a2) * 0.25 * s,
              ];
            limb(
              [sx, shY, e[0], e[1], h[0], h[1]],
              0.14 * s,
              lk.vest ? "#3a4a6b" : lk.top,
              lw,
            );
            ci(h[0], h[1], 0.085 * s, skin, OUT, lw);
            if (item) drawItem(item, h[0], h[1], s, f, lw);
            return h;
          };
        // arm poses [a1,a2,dir] for front(facing side) and back
        let A, B;
        const fs = f,
          bs = -f;
        if (zed) {
          A = [
            1.35 + Math.cos(t * 3.3 + id) * 0.2,
            1.5 + Math.cos(t * 4.6 + id) * 0.3,
            f,
          ];
          B = [
            1.5 + Math.sin(t * 3 + id) * 0.2,
            1.62 + Math.sin(t * 4.1 + id) * 0.3,
            f,
          ];
        } else if (run) {
          A = [sw * 1.3, sw * 1.3 + 1.3, f];
          B = [-sw * 1.3, -sw * 1.3 + 1.3, f];
        } else if (o.scared) {
          A = [
            2.5 + Math.sin(t * 20 + id) * 0.1,
            2.9 + Math.sin(t * 17) * 0.12,
            fs,
          ];
          B = [2.5 + Math.cos(t * 19 + id) * 0.1, 2.9, bs];
        } else if (o.talk) {
          A = [
            0.9 + Math.sin(t * 4.3 + id) * 0.3,
            2.1 + Math.sin(t * 6.7 + id) * 0.5,
            fs,
          ];
          B = [
            0.25 + Math.sin(t * 3.1 + id) * 0.1,
            0.6 + Math.sin(t * 5.3 + 1) * 0.3,
            bs,
          ];
        } else if (o.walk != null) {
          A = [sw * 0.6, sw * 0.6 + 0.3, f];
          B = [-sw * 0.6, -sw * 0.6 + 0.3, f];
        } else {
          A = [0.12 + Math.sin(t * 1.4 + id) * 0.04, 0.05, fs];
          B = [0.12 - Math.sin(t * 1.4 + id) * 0.04, 0.05, bs];
        }
        if (o.arm === "up")
          A = [
            2.6 + Math.sin(t * 4 + id) * 0.08,
            3.0 + Math.sin(t * 6 + id) * 0.12,
            fs,
          ];
        if (o.item === "cartpush") {
          A = [1.25, 1.5, f];
          B = [1.15, 1.5, f];
        }
        if (
          o.item &&
          o.item !== "cartpush" &&
          !o.scared &&
          o.arm !== "up" &&
          !run
        )
          A = [0.8, 2.0 + Math.sin(t * 1.3 + id) * 0.1, fs];
        const backSd = -f,
          frontSd = f;
        ARM(backSd, B[0], B[1], B[2]);
        // body
        rr(-wd, -1.0 * s + bob, wd * 2, 0.68 * s, 0.2 * s, lk.top, OUT, lw);
        if (zed) {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(-wd, -1.0 * s + bob, wd * 2, 0.68 * s, 0.2 * s);
          ctx.clip();
          el(
            -wd * 0.3,
            -0.5 * s + bob,
            0.1 * s,
            0.08 * s,
            "rgba(60,20,20,.55)",
          );
          po(
            [
              -wd,
              -0.4 * s + bob,
              -wd * 0.4,
              -0.34 * s + bob,
              0,
              -0.42 * s + bob,
              wd * 0.5,
              -0.33 * s + bob,
              wd,
              -0.42 * s + bob,
              wd,
              -0.2 * s,
              -wd,
              -0.2 * s,
            ],
            "#161827",
          );
          ctx.restore();
        }
        if (lk.shirt || lk.tie) {
          po(
            [
              -0.09 * s,
              -1.0 * s + bob,
              0.09 * s,
              -1.0 * s + bob,
              0,
              -0.8 * s + bob,
            ],
            lk.shirt ? "#f4f4f0" : lk.top,
            OUT,
            lw * 0.6,
          );
          if (lk.tie)
            po(
              [
                -0.035 * s,
                -0.93 * s + bob,
                0.035 * s,
                -0.93 * s + bob,
                0.05 * s,
                -0.6 * s + bob,
                0,
                -0.54 * s + bob,
                -0.05 * s,
                -0.6 * s + bob,
              ],
              lk.tie,
              OUT,
              lw * 0.5,
            );
        }
        if (lk.vest) {
          rr(-wd, -0.72 * s + bob, wd * 2, 0.09 * s, 0, "#e8eef2");
          rr(-wd, -0.56 * s + bob, wd * 2, 0.09 * s, 0, "#e8eef2");
          rr(-wd, -1.0 * s + bob, wd * 2, 0.68 * s, 0.2 * s, null, OUT, lw);
        }
        if (lk.badge)
          ci(f * 0.12 * s, -0.78 * s + bob, 0.05 * s, "#f2c21a", OUT, lw * 0.5);
        if (lk.epa)
          for (const sd of [-1, 1])
            rr(
              sd * wd * 0.75 - 0.06 * s,
              -1.0 * s + bob,
              0.12 * s,
              0.05 * s,
              2,
              "#f2c21a",
              OUT,
              lw * 0.4,
            );
        if (base === "gus") {
          for (let i = -1; i <= 1; i++)
            ln(
              [i * wd * 0.55, -0.98 * s + bob, i * wd * 0.55, -0.34 * s + bob],
              lw * 0.7,
              "rgba(0,0,0,.22)",
            );
          ln(
            [-wd, -0.66 * s + bob, wd, -0.66 * s + bob],
            lw * 0.7,
            "rgba(0,0,0,.22)",
          );
        }
        if (base === "eli") {
          rr(
            -0.12 * s,
            -0.62 * s + bob,
            0.24 * s,
            0.14 * s,
            0.05 * s,
            "#17998a",
          );
        }
        // head
        const hx = f * 0.03 * s + (zed ? Math.sin(t * 2.7 + id) * 0.02 * s : 0),
          hy = -1.3 * s + bob + (o.talk ? Math.sin(t * 8 + id) * 0.006 * s : 0),
          r = 0.34 * s;
        if (lk.pillow) {
          ctx.beginPath();
          ctx.arc(0, -1.06 * s + bob, 0.3 * s, 0.05 * PI, 0.95 * PI);
          ctx.lineWidth = 0.17 * s + lw * 2;
          ctx.strokeStyle = OUT;
          ctx.lineCap = "round";
          ctx.stroke();
          ctx.lineWidth = 0.17 * s;
          ctx.strokeStyle = "#ff8a2a";
          ctx.stroke();
        }
        if (lk.hs === "long")
          rr(
            hx - r * 1.08,
            hy - r * 0.5,
            r * 2.16,
            r * 1.7,
            r * 0.5,
            lk.hair,
            OUT,
            lw,
          );
        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(zed ? (0.16 + Math.sin(t * 2.1 + id) * 0.06) * f : 0);
        ci(0, 0, r, skin, OUT, lw);
        if (shade) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(0, 0, r - lw / 2, 0, 7);
          ctx.clip();
          el(-f * 0.1 * s, 0.2 * s, 0.3 * s, 0.2 * s, shade);
          ctx.restore();
        }
        // hair
        const hair = (a0, a1) => {
          ctx.beginPath();
          ctx.arc(0, 0, r * 1.02, a0, a1);
          ctx.closePath();
          ctx.fillStyle = lk.hair;
          ctx.fill();
          ctx.lineWidth = lw;
          ctx.strokeStyle = OUT;
          ctx.lineJoin = "round";
          ctx.stroke();
        };
        if (lk.hs === "short" || lk.hs === "long")
          hair(
            PI * 1.02 + (f > 0 ? -0.1 : 0.25),
            PI * 1.98 + (f > 0 ? -0.25 : 0.1),
          );
        if (lk.hs === "slick") {
          hair(PI * 0.98, PI * 2.02);
        }
        if (lk.hs === "buzz") {
          ctx.globalAlpha = 0.75;
          hair(PI * 1.08, PI * 1.92);
          ctx.globalAlpha = 1;
        }
        if (lk.hs === "cap") {
          hair(PI, PI * 2);
          ctx.fillStyle = lk.capc;
          ctx.beginPath();
          ctx.arc(0, -r * 0.05, r * 1.06, PI, PI * 2);
          ctx.closePath();
          ctx.fill();
          ctx.lineWidth = lw;
          ctx.strokeStyle = OUT;
          ctx.stroke();
          rr(
            f > 0 ? r * 0.2 : -r * 1.5,
            -r * 0.2,
            r * 1.3,
            r * 0.2,
            r * 0.1,
            lk.capc,
            OUT,
            lw,
          );
        }
        if (lk.hs === "chat") {
          rr(
            -r * 1.05,
            -r * 0.72,
            r * 2.1,
            r * 0.28,
            r * 0.08,
            "#1c2644",
            OUT,
            lw,
          );
          ctx.fillStyle = "#f4f4f0";
          ctx.beginPath();
          ctx.ellipse(0, -r * 0.8, r * 1.0, r * 0.5, 0, PI, PI * 2);
          ctx.fill();
          ctx.lineWidth = lw;
          ctx.strokeStyle = OUT;
          ctx.stroke();
          rr(
            f > 0 ? r * 0.1 : -r * 1.3,
            -r * 0.5,
            r * 1.2,
            r * 0.16,
            r * 0.08,
            "#1c2644",
            OUT,
            lw,
          );
          ci(f * 0.3 * r, -r * 0.86, r * 0.12, "#f2c21a", OUT, lw * 0.5);
        }
        if (lk.hs === "muffs") {
          hair(PI * 1.05, PI * 1.95);
          ln(
            [
              -r * 0.95,
              -r * 0.2,
              -r * 0.6,
              -r * 1.0,
              r * 0.6,
              -r * 1.0,
              r * 0.95,
              -r * 0.2,
            ],
            lw * 1.6,
            OUT,
          );
          for (const sd of [-1, 1])
            rr(
              sd * r * 0.98 - r * 0.16,
              -r * 0.3,
              r * 0.32,
              r * 0.56,
              r * 0.12,
              "#e04b3a",
              OUT,
              lw,
            );
        }
        if (lk.hs === "bald" && !zed) {
          for (const sd of [-1, 1])
            el(
              sd * r * 0.9,
              -r * 0.1,
              r * 0.2,
              r * 0.3,
              lk.hair,
              OUT,
              lw * 0.6,
            );
        }
        // face
        const ex = f * 0.07 * s,
          ey = -0.02 * s,
          eo = 0.135 * s,
          blink = !zed && (t + id * 3.7) % 3.6 < 0.12,
          big = o.scared ? 1.25 : 1;
        for (const sd of [-1, 1]) {
          const cx = ex + sd * eo,
            erx = 0.085 * s * big,
            ery = (blink ? 0.012 : 0.105) * s * big;
          if (zed) {
            el(cx, ey, erx * 1.05, 0.1 * s, "#12131c");
            ci(cx + f * 0.02 * s, ey + 0.01 * s, 0.022 * s, "#e6f0d8");
          } else {
            el(cx, ey, erx, ery, "#fff", OUT, lw * 0.7);
            if (!blink)
              ci(
                cx + f * 0.028 * s + (o.look || 0) * 0.02 * s,
                ey + 0.012 * s,
                (o.scared ? 0.028 : 0.045) * s,
                "#161827",
              );
          }
          // brows
          const by2 = ey - 0.15 * s * big,
            tilt =
              (o.scared
                ? -0.05
                : zed
                  ? 0.06
                  : o.talk
                    ? Math.sin(t * 3 + id) * 0.02
                    : 0) *
              s *
              sd;
          if (!zed || 1)
            ln(
              [cx - 0.07 * s, by2 + tilt, cx + 0.07 * s, by2 - tilt],
              lw * 0.9,
              zed ? "#2a3a2c" : OUT,
            );
        }
        if (lk.glasses && !zed) {
          for (const sd of [-1, 1])
            ci(ex + sd * eo, ey, 0.115 * s, null, OUT, lw * 0.9);
          ln([ex - 0.02 * s, ey, ex + 0.02 * s, ey], lw * 0.9, OUT);
        }
        const mx = f * 0.09 * s,
          my = 0.17 * s;
        if (zed) {
          el(
            mx,
            my,
            0.1 * s,
            (0.07 + 0.03 * Math.sin(t * 6 + id)) * s,
            "#2a1016",
            OUT,
            lw * 0.6,
          );

        gr(0, 560, W, 160, "#6a7396", "#434b6e");
        for (const x of [330, 560]) {
          const bz = o.beep && Math.sin(t * 10 + x) > 0;
          rr(x - 70, 250, 26, 320, 6, "#8e97a6", OUT, 5);
          rr(x + 44, 250, 26, 320, 6, "#8e97a6", OUT, 5);
          rr(x - 70, 224, 140, 36, 8, bz ? "#ff5a4a" : "#5d6676", OUT, 5);
          if (bz) glow(x, 240, 120, "rgba(255,60,50,.8)");
        }
        rr(700, 440, 360, 60, 10, "#5d6676", OUT, 5);
        rr(790, 360, 170, 90, 10, "#3a4160", OUT, 5);
        for (let i = 0; i < 3; i++)
          rr(720 + i * 110, 410, 70, 34, 6, "#8e97a6", OUT, 4);
        return { gy: 686, s: 178 };
      };
      BG.hangar = (sh, t, lt) => {
        const o = sh.o;
        gr(0, 0, W, 560, "#6a7396", "#474f72");
        for (let i = 0; i < 32; i++)
          rr(i * 42, 0, 4, 560, 0, "rgba(0,0,0,.14)");
        for (const x of [260, 640]) {
          rr(x - 90, 40, 180, 20, 8, "#eef4ff", OUT, 4);
          po(
            [x - 80, 60, x + 80, 60, x + 300, 720, x - 300, 720],
            "rgba(220,235,255,.06)",
          );
        }
        const op = o.doors === 2 ? 1 : o.doors === 1 ? ease(lt / 4) * 0.6 : 0;
        if (op > 0 || o.doors) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(820, 110, 460, 450);
          ctx.clip();
          sky("night", t);
          ctx.translate(0, 40);
          cityDark(t, 470, 1);
          ctx.restore();
          gr(820, 520, 460, 40, "#2a3048", "#171a2e");
          if (o.zout)
            for (let i = 0; i < 12; i++)
              ch({
                k: i % 3 ? "zcrew" : "zpax",
                x: 860 + i * 36 + Math.sin(t * 2 + i) * 6 - lt * 4,
                y: 548 + (i % 2) * 8,
                s: 58,
                f: -1,
                ci: i,
                walk: lt * 4 + i,
              });
        }
        rr(820, 110, 230 * (1 - op), 450, 0, "#5d6676", OUT, 6);
        rr(1050 + 230 * op, 110, 240, 450, 0, "#5d6676", OUT, 6);
        rr(810, 96, 480, 20, 6, "#23252f", OUT, 4);
        gr(0, 560, W, 160, "#5a6078", "#34394f");
        SH._mid = () => {
          ctx.save();
          ctx.translate(480, 430);
          rr(-230, -50, 420, 110, 50, "#e8ecf0", OUT, 6);
          po([-230, -20, -320, -150, -250, -150, -150, -36], "#e04b3a", OUT, 5);
          rr(-120, -30, 300, 22, 8, "#e04b3a");
          po([-60, -56, -200, -80, 120, -80, 60, -56], "#cfd6dc", OUT, 5);
          for (let i = 0; i < 4; i++)
            rr(-80 + i * 56, -30, 34, 30, 8, "#bfe6f7", OUT, 3);
          rr(186, -36, 16, 84, 6, "#23252f", OUT, 4);
          if (o.prop)
            el(202, 6, 8, 90, "rgba(220,220,235,.5)", null, 0, t * 40);
          else rr(196, -80, 10, 170, 5, "#23252f", OUT, 3);
          for (const gx of [-90, 90]) {
            ln([gx, 60, gx, 112], 9, OUT);
            ci(gx, 118, 20, "#23252f", OUT, 5);
          }
          tx("CARGO", 20, 24, 26, "#8e97a6");
          ctx.restore();
        };
        return { gy: 686, s: 178 };
      };
      BG.radio = (sh, t) => {
        gr(0, 0, W, H, "#262c48", "#12152a");
        glow(640, 360, 520, "rgba(90,120,220,.35)");
        ctx.save();
        ctx.translate(640, 400);
        ctx.rotate(-0.06);
        rr(-150, -230, 300, 500, 40, "#23252f", OUT, 8);
        rr(-110, -190, 220, 130, 14, "#3fd17a", OUT, 5);
        tx("WNTE", 0, -140, 54, "#0b2a16");
        tx("101.5 FM", 0, -92, 26, "#0b2a16");
        for (let i = 0; i < 5; i++)
          rr(-110, -20 + i * 30, 220, 12, 6, "#3a3e4e");
        ci(-70, 190, 30, "#e04b3a", OUT, 5);
        ci(70, 190, 30, "#5d6676", OUT, 5);
        rr(70, -380, 24, 160, 10, "#23252f", OUT, 6);
        ctx.restore();
        if (sh.o.on)
          for (let i = 0; i < 3; i++) {
            const a = (t * 1.3 + i / 3) % 1;
            ctx.globalAlpha = 1 - a;
            ctx.lineWidth = 8;
            ctx.strokeStyle = "#3fd17a";
            ctx.beginPath();
            ctx.arc(726, 20, 30 + a * 150, -PI * 0.9, -PI * 0.1);
            ctx.stroke();
          }
        ctx.globalAlpha = 1;
        return { gy: 2000, s: 100 };
      };
      BG.title = (sh, t, lt) => {
        ctx.fillStyle = "#07080f";
        ctx.fillRect(0, 0, W, H);
        glow(640, 340, 500, "rgba(255,60,50,.22)");
        const ls = sh.o.lines || [];
        ls.forEach((s, i) => {
          const k = backOut(clamp((lt - 0.15 - i * 0.3) / 0.4, 0, 1));
          ctx.save();
          ctx.translate(640, 330 + (i - (ls.length - 1) / 2) * 130);
          ctx.scale(k, k);
          ctx.shadowColor = "rgba(255,80,60,.9)";
          ctx.shadowBlur = 44;
          tx(s, 0, 0, 128, "#fff4ea");
          ctx.restore();
        });
        return { gy: 2000, s: 100 };
      };
      // ---------- actors ----------
      function parseA(str, lt, dur, r) {
        const m = str.match(
          /^([a-z]+)@(-?\d+)(?:(>>?)(-?\d+))?([!^<_s]*)(?::(\w+))?$/,
        );
        if (!m) throw new Error("bad actor " + str);
        let x = +m[2],
          walk = null,
          f = 1,
          run = 0;
        const fl = m[5] || "";
        if (m[3]) {
          const fast = m[3] === ">>",
            u = clamp(lt / (fast ? Math.min(dur, 3.6) : dur), 0, 1),
            x2 = +m[4];
          x = lerp(+m[2], x2, u);
          if (u < 1) {
            walk = lt * (fast ? 15 : 7.5) + +m[2] * 0.01;
            run = fast;
          }
          f = x2 < +m[2] ? -1 : 1;
        }
        if (fl.includes("<")) f = -1;
        return {
          k: m[1],
          x,
          y: r.gy,
          s: r.s,
          f,
          walk,
          run,
          scared: fl.includes("!"),
          arm: fl.includes("^") ? "up" : null,
          item: m[6],
          sit: fl.includes("s"),
          lie: fl.includes("_"),
        };
      }
      function actors(sh, t, lt, r) {
        const o = sh.o,
          list = [];
        if (o.z) {
          const zr = o.zr || [40, W - 40],
            zm = o.zm == null ? -10 : o.zm;
          for (let i = 0; i < o.z; i++) {
            const x =
              zr[0] +
              hash(i * 7 + sh.i) * (zr[1] - zr[0]) +
              zm * lt * (0.75 + hash(i + 3) * 0.5);
            list.push({
              k: o.zk
                ? "z" + o.zk
                : i % 3
                  ? "zpax"
                  : "zcrew".slice(0, o.zk ? 5 : 4),
              x,
              y: r.gy + (hash(i * 5 + 1) - 0.5) * 34,
              s: r.s * (0.93 + hash(i + 11) * 0.14),
              f: zm > 0 ? 1 : zm < 0 ? -1 : hash(i) > 0.5 ? 1 : -1,
              walk: zm ? lt * (Math.abs(zm) > 80 ? 9 : 4) + i * 1.7 : null,
              run: Math.abs(zm) > 100,
              ci: i,
            });
          }
        }
        if (o.c)
          for (let i = 0; i < o.c; i++)
            list.push({
              k: "pax",
              x: 90 + hash(i * 9 + 2) * 380 + (i % 2) * 640,
              y: r.gy - 30 + (hash(i * 3) - 0.5) * 20,
              s: r.s * 0.95,
              f: hash(i) > 0.5 ? 1 : -1,
              ci: i + 1,
            });
        (o.a || []).forEach((a, i) => {
          const p = parseA(a, lt, sh.dur, r);
          if (p.k === "zzz") return;
          p.ci = i + 2;
          if (
            o.talk === p.k &&
            lt > sh.words[0][1] - 0.05 &&
            lt < sh.words[sh.words.length - 1][2]
          )
            p.talk = 1;
          if (p.sit && sh.bg === "cabin") {
            p.y = 560;
            p.s = 108;
          }
          list.push(p);
        });
        list.sort((a, b) => a.y - b.y);
        for (const p of list) ch(p);
        return list;
      }
      // ---------- overlay text ----------
      function subs(sh, lt) {
        const ws = sh.words;
        if (lt < ws[0][1] - 0.05 || lt > ws[ws.length - 1][2] + 0.35) return;
        const chs = [];
        let cur = [];
        for (const w of ws) {
          cur.push(w);
          if (cur.length >= 5 || (/[.,?!]$/.test(w[0]) && cur.length >= 2)) {
            chs.push(cur);
            cur = [];
          }
        }
        if (cur.length) {
          if (cur.length < 2 && chs.length) chs[chs.length - 1].push(...cur);
          else chs.push(cur);
        }
        const c =
          chs.find((c) => lt < c[c.length - 1][2] + 0.02) ||
          chs[chs.length - 1];
        ctx.font = "900 54px Inter";
        const sp = 30,
          wd = c.map((w) => ctx.measureText(w[0].toUpperCase()).width),
          tot = wd.reduce((a, b) => a + b, 0) + sp * (c.length - 1),
          fit = Math.min(1, 1160 / tot);
        ctx.save();
        ctx.translate(640, 650);
        ctx.scale(fit, fit);
        let x = -tot / 2;
        const voice = sh.sp === "ELI";
        c.forEach((w, i) => {
          const s = w[0].toUpperCase(),
            on = lt >= w[1] && lt < w[2] + 0.04,
            past = lt >= w[2],
            pop = on ? 1.05 : 1;
          ctx.save();
          ctx.translate(x + wd[i] / 2, on ? -4 : 0);
          ctx.scale(pop, pop);
          ctx.font = "900 54px Inter";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.lineJoin = "round";
          ctx.lineWidth = 14;
          ctx.strokeStyle = "#0b0c14";
          ctx.strokeText(s, 0, 0);
          ctx.fillStyle = on ? "#ffd92e" : voice ? "#ffffff" : "#bfeaff";
          ctx.fillText(s, 0, 0);
          ctx.restore();
          x += wd[i] + sp;
        });
        ctx.restore();
      }
      function tag(sh, t) {
        if (!sh.day) return;
        const first = TL.shots.find((s) => s.day === sh.day),
          k = clamp((t - first.start) / 0.3, 0, 1);
        ctx.font = "900 26px Inter";
        const w = ctx.measureText(sh.day).width + 56;
        ctx.save();
        ctx.translate(lerp(-w, 34, backOut(k)), 30);
        rr(0, 0, w, 48, 24, "rgba(11,12,20,.82)");
        ci(24, 24, 7, Math.sin(t * 5) > 0 ? "#ff5a4a" : "#7a2222");
        tx(sh.day, 40, 25, 26, "#fff", "left");
        ctx.restore();
      }
      // ---------- render ----------
      function render(t) {
        TT = t;
        BO = Math.floor(t * 12);
        let sh = TL.shots[0];
        for (const s of TL.shots) {
          if (t >= s.start) sh = s;
          else break;
        }
        SH = sh;
        sh._post = null;
        sh._lite = null;
        sh._mid = null;
        const lt = clamp(t - sh.start, 0, sh.dur),
          u = lt / sh.dur,
          o = sh.o;
        LT = lt;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        srand(900 + BO * 7919);
        const alt = sh.i % 2 ? -1 : 1;
        let z =
            o.cam === "in"
              ? lerp(1.1, 1.32, ease(u))
              : o.cam === "out"
                ? lerp(1.32, 1.1, ease(u))
                : alt > 0 ? lerp(1.1, 1.2, ease(u)) : lerp(1.2, 1.1, ease(u)),
          sx = Math.sin(t * 0.9) * 4 + alt * lerp(-26, 26, ease(u)),
          sy = Math.cos(t * 0.7) * 3;
        if (o.shake) {
          const a = (lt < 1.6 ? 16 * (1 - lt / 1.6) : 0) + 3;
          sx += (rnd() - 0.5) * a;
          sy += (rnd() - 0.5) * a;
        }
        ctx.translate(W / 2 + sx, H * 0.55 + sy);
        ctx.scale(z, z);
        ctx.translate(-W / 2, -H * 0.55);
        const r = BG[sh.bg](sh, t, lt);
        if (sh._mid) sh._mid();
        actors(sh, t, lt, r);
        if (sh._post) sh._post();
        if (o.dark) { ctx.fillStyle = "rgba(6,8,30," + o.dark * 0.55 + ")"; ctx.fillRect(-60, -60, W + 120, H + 120); }
        if (sh._lite) sh._lite();
        const M = MOOD[sh.pal];
        if (M.amb) {
          ctx.fillStyle = M.amb;
          ctx.fillRect(-60, -60, W + 120, H + 120);
        }
        if (sh.pal === "emer" || (o.emer && sh.bg !== "planeext"))
          emerOverlay();
        if (o.speed) {
          srand(BO * 31 + 7);
          for (let i = 0; i < 22; i++) {
            const y = rnd() * 600,
              x = rnd() * W,
              l = 140 + rnd() * 300;
            ctx.lineWidth = 2 + rnd() * 4;
            ctx.strokeStyle = "rgba(255,255,255,.28)";
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - l, y);
            ctx.stroke();
          }
        }
        ctx.restore();
        const vg = ctx.createRadialGradient(
          W / 2,
          H / 2,
          H * 0.42,
          W / 2,
          H / 2,
          H * 1.0,
        );
        vg.addColorStop(0, "rgba(0,0,0,0)");
        vg.addColorStop(1, "rgba(5,4,16,.42)");
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
        if (o.rewind) {
          srand(BO * 91 + 3);
          for (let i = 0; i < 5; i++) {
            const y = Math.floor(rnd() * 560),
              h = 10 + Math.floor(rnd() * 36),
              dx = Math.floor((rnd() - 0.5) * 120);
            ctx.drawImage(cv, 0, y, W, h, dx, y, W, h);
          }
          ctx.fillStyle = "rgba(255,255,255,.05)";
          for (let y = 0; y < 600; y += 6) ctx.fillRect(0, y, W, 2);
          if (Math.floor(t * 4) % 2 === 0)
            tx("◀◀ REWIND", 60, 60, 38, "#fff", "left");
        }
        tag(sh, t);
        subs(sh, lt);
        let fade = 0;
        if (lt < 0.1) fade = 0.5 * (1 - lt / 0.1);
        if (t < 0.1) fade = 1 - t / 0.1;
        if (t > TL.total - 1) fade = clamp((t - (TL.total - 1)) / 0.9, 0, 1);
        if (fade > 0) {
          ctx.fillStyle = `rgba(0,0,0,${fade})`;
          ctx.fillRect(0, 0, W, H);
        }
      }
      window.setTL = (tl) => {
        TL = tl;
      };
      window.render = render;
      document.fonts.load("900 54px Inter").then(() => {
        window.ready = true;
      });
    </script>
