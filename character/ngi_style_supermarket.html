<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1280" height="720"></canvas>
    <script>
      const W = 1280,
        H = 720,
        cv = document.getElementById("c"),
        ctx = cv.getContext("2d");
      const INK = "#2a1f1a";
      // ---------- boil / jitter ----------
      let seed = 1,
        boil = 0;
      function srand(s) {
        seed = s >>> 0 || 1;
      }
      function rnd() {
        seed ^= seed << 13;
        seed >>>= 0;
        seed ^= seed >> 17;
        seed ^= seed << 5;
        seed >>>= 0;
        return seed / 4294967296;
      }
      let J = 1.3;
      function jx(v) {
        return v + (rnd() - 0.5) * J;
      }
      function hash(n) {
        n = n ^ 61 ^ (n >>> 16);
        n = n + (n << 3);
        n = n ^ (n >>> 4);
        n = Math.imul(n, 0x27d4eb2d);
        n = n ^ (n >>> 15);
        return (n >>> 0) / 4294967296;
      }
      function clamp(v, a, b) {
        return Math.max(a, Math.min(b, v));
      }
      function ease(t) {
        t = clamp(t, 0, 1);
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }
      function backOut(t) {
        t = clamp(t, 0, 1);
        const c = 1.7;
        return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
      }
      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function line(pts, w, col = INK) {
        ctx.beginPath();
        ctx.moveTo(jx(pts[0]), jx(pts[1]));
        for (let i = 2; i < pts.length; i += 2)
          ctx.lineTo(jx(pts[i]), jx(pts[i + 1]));
        ctx.lineWidth = w;
        ctx.strokeStyle = col;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
      }
      function poly(pts, fill, w, col = INK) {
        ctx.beginPath();
        ctx.moveTo(jx(pts[0]), jx(pts[1]));
        for (let i = 2; i < pts.length; i += 2)
          ctx.lineTo(jx(pts[i]), jx(pts[i + 1]));
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (w) {
          ctx.lineWidth = w;
          ctx.strokeStyle = col;
          ctx.lineJoin = "round";
          ctx.stroke();
        }
      }
      function circ(x, y, r, fill, w, col = INK) {
        ctx.beginPath();
        ctx.arc(
          jx(x),
          jx(y),
          Math.max(0.5, r + (rnd() - 0.5) * J * 0.5),
          0,
          Math.PI * 2,
        );
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (w) {
          ctx.lineWidth = w;
          ctx.strokeStyle = col;
          ctx.stroke();
        }
      }
      function rectP(x, y, w, h, fill, lw) {
        poly([x, y, x + w, y, x + w, y + h, x, y + h], fill, lw);
      }

      // ---------- stick character ----------
      // o: {x, y(feet), s(px per unit), face:1/-1, kind:'hero'|'zombie', walk:phase or null, cloth, hat, armUp, look, mouth}
      function stick(o) {
        const s = o.s,
          x = o.x,
          y = o.y,
          f = o.face || 1,
          lw = Math.max(1.6, s * 0.04);
        const P = (u, v) => [x + u * s * f, y + v * s];
        const hipY = -0.78,
          neckY = -1.38;
        let bob = 0,
          l1 = 0,
          l2 = 0,
          a1 = 0,
          a2 = 0;
        if (o.walk != null) {
          const p = o.walk;
          l1 = Math.sin(p) * 0.18;
          l2 = -l1;
          bob = Math.abs(Math.cos(p)) * -0.03;
          a1 = -l1 * 0.6;
          a2 = -l2 * 0.6;
        }
        const by = bob + (o.breath || 0);
        // legs
        const hip = P(0, hipY + by);
        const zomb = o.kind === "zombie";
        const lk = zomb ? 0.05 : 0;
        line(
          [
            ...hip,
            ...P(-0.08 + l1, -0.38 + by * 0.5),
            ...P(-0.1 + l1 * 1.6 + lk, 0),
          ],
          lw,
        );
        line(
          [...hip, ...P(0.06 + l2, -0.38 + by * 0.5), ...P(0.08 + l2 * 1.6, 0)],
          lw,
        );
        line(
          [...P(-0.1 + l1 * 1.6 + lk, 0), ...P(-0.0 + l1 * 1.6 + lk, 0)],
          lw,
        );
        line([...P(0.08 + l2 * 1.6, 0), ...P(0.18 + l2 * 1.6, 0)], lw);
        // back arm (behind clothes)
        const sh = P(0.02, neckY + 0.08 + by);
        if (zomb) {
          line(
            [
              ...sh,
              ...P(-0.28, -1.12 + by + Math.sin((o.walk || 0) * 0.7) * 0.05),
              ...P(-0.34, -1.32 + by),
            ],
            lw,
          );
        }
        // clothes
        if (o.cloth) {
          const c = o.cloth;
          if (o.kind === "hero") {
            // jacket
            poly(
              [
                ...P(-0.17, -1.36 + by),
                ...P(0.17, -1.36 + by),
                ...P(0.21, -0.62 + by),
                ...P(-0.19, -0.62 + by),
              ],
              "#5f7b47",
              lw,
            );
            line([...P(0.01, -1.3 + by), ...P(0.02, -0.64 + by)], lw * 0.6);
            poly(
              [
                ...P(-0.19, -0.72 + by),
                ...P(0.21, -0.72 + by),
                ...P(0.21, -0.66 + by),
                ...P(-0.19, -0.66 + by),
              ],
              "#3b2a1e",
              lw * 0.5,
            );
            // scarf
            poly(
              [
                ...P(-0.15, -1.42 + by),
                ...P(0.17, -1.42 + by),
                ...P(0.17, -1.33 + by),
                ...P(-0.15, -1.33 + by),
              ],
              "#e5772a",
              lw * 0.8,
            );
            poly(
              [
                ...P(-0.1, -1.36 + by),
                ...P(-0.03, -1.36 + by),
                ...P(-0.06, -1.08 + by),
                ...P(-0.13, -1.09 + by),
              ],
              "#e5772a",
              lw * 0.8,
            );
          } else
            poly(
              [
                ...P(-0.16, -1.36 + by),
                ...P(0.16, -1.36 + by),
                ...P(0.2, -0.58 + by),
                ...P(-0.2, -0.58 + by),
              ],
              c,
              lw,
            );
        }
        // torso line
        line([...P(0, neckY + by), ...hip], lw);
        // front arm
        if (zomb) {
          line(
            [
              ...sh,
              ...P(0.3, -1.12 + by + Math.cos((o.walk || 0) * 0.7) * 0.05),
              ...P(0.36, -1.34 + by),
            ],
            lw,
          );
        } else if (o.armUp != null) {
          const a = o.armUp; // angle radians from down
          const e = P(Math.sin(a) * 0.3, neckY + 0.1 + by + Math.cos(a) * 0.3),
            h = P(
              Math.sin(a + (o.elbow || 0.3)) * 0.58,
              neckY + 0.1 + by + Math.cos(a + (o.elbow || 0.3)) * 0.58,
            );
          line([...sh, ...e, ...h], lw);
          if (o.hold) o.hold(h);
        } else {
          line(
            [
              ...sh,
              ...P(0.12 + a1, -1.0 + by),
              ...P(0.1 + a1 * 1.4, -0.72 + by),
            ],
            lw,
          );
        }
        if (!zomb)
          line(
            [
              ...sh,
              ...P(-0.1 + a2, -1.0 + by),
              ...P(-0.08 + a2 * 1.4, -0.72 + by),
            ],
            lw,
          );
        // head
        const hr = 0.21,
          hc = P(0.02, -1.6 + by);
        if (zomb) {
          circ(hc[0], hc[1], hr * s, "#9ea896", lw);
          ctx.save();
          ctx.beginPath();
          ctx.arc(hc[0], hc[1], hr * s - lw / 2, 0, Math.PI * 2);
          ctx.clip();
          ctx.fillStyle = "rgba(70,85,72,.35)";
          ctx.beginPath();
          ctx.ellipse(
            hc[0] + 0.02 * s * f,
            hc[1] + 0.13 * s,
            0.16 * s,
            0.12 * s,
            0,
            0,
            Math.PI * 2,
          );
          ctx.fill();
          ctx.restore();
          if (o.hair)
            poly(
              [
                ...P(-0.2, -1.62 + by),
                ...P(-0.16, -1.78 + by),
                ...P(0.04, -1.84 + by),
                ...P(0.22, -1.74 + by),
                ...P(0.18, -1.66 + by),
                ...P(0, -1.74 + by),
              ],
              o.hair,
              lw * 0.8,
            );
          for (const ex of [-0.075, 0.075]) {
            const ec = P(0.02 + ex, -1.63 + by);
            ctx.beginPath();
            ctx.ellipse(ec[0], ec[1], 0.042 * s, 0.052 * s, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#0b0b0b";
            ctx.fill();
          }
          const m = P(0.03, -1.5 + by);
          ctx.beginPath();
          ctx.ellipse(
            m[0],
            m[1],
            0.028 * s,
            0.04 * s * (o.mouth || 1),
            0,
            0,
            Math.PI * 2,
          );
          ctx.fillStyle = "#1a1210";
          ctx.fill();
        } else {
          circ(hc[0], hc[1], hr * s, "#e8c4a2", lw);
          const lk = o.look || 0;
          // glasses (side view)
          const g1 = P(0.1 + lk * 0.02, -1.6 + by),
            g2 = P(0.205 + lk * 0.02, -1.6 + by);
          circ(g1[0], g1[1], 0.058 * s, "#f6f4ee", lw * 0.7);
          circ(g2[0], g2[1], 0.042 * s, "#f6f4ee", lw * 0.7);
          circ(g1[0] + 0.012 * s * f, g1[1] + 0.005 * s, 0.022 * s, "#111", 0);
          circ(g2[0] + 0.01 * s * f, g2[1] + 0.005 * s, 0.016 * s, "#111", 0);
          line([...P(-0.05, -1.62 + by), ...P(0.045, -1.61 + by)], lw * 0.6);
          // mouth
          if (o.mouthO) {
            const m = P(0.13, -1.49 + by);
            ctx.beginPath();
            ctx.ellipse(m[0], m[1], 0.022 * s, 0.03 * s, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#3a1512";
            ctx.fill();
          } else line([...P(0.09, -1.49 + by), ...P(0.16, -1.5 + by)], lw * 0.6);
          // colander helmet
          ctx.beginPath();
          ctx.arc(jx(hc[0]), jx(hc[1] - 0.03 * s), hr * s * 1.06, Math.PI, 0);
          ctx.closePath();
          ctx.fillStyle = "#a9b0b9";
          ctx.fill();
          ctx.lineWidth = lw;
          ctx.strokeStyle = INK;
          ctx.stroke();
          line([...P(-0.25, -1.66 + by), ...P(0.27, -1.66 + by)], lw * 1.1);
          for (const [dx, dy] of [[-0.12, -1.72], [-0.02, -1.76], [0.08, -1.73], [-0.06, -1.82], [0.04, -1.84], [0.14, -1.7], [-0.16, -1.79]]) {
            const hp = P(dx, dy + by);
            circ(hp[0], hp[1], 0.014 * s, "#2b2f36", 0);
          }
          const hd1 = P(-0.24, -1.68 + by),
            hd2 = P(-0.36, -1.7 + by);
          line([...hd1, ...hd2], lw * 1.1, "#7d8590");
          circ(hd2[0] - 0.03 * s * f, hd2[1], 0.03 * s, null, lw * 0.8);
        }
      }

      // ---------- caption ----------
      function caption(text, t0, t) {
        const k = t - t0;
        if (k < 0) return;
        const a = clamp(k / 0.12, 0, 1);
        const sc = lerp(0.6, 1, backOut(k / 0.35));
        ctx.save();
        ctx.translate(W / 2, 640);
        ctx.scale(sc, sc);
        ctx.globalAlpha = a;
        ctx.font = "900 78px Inter";
        ctx.textBaseline = "middle";
        const letters = [...text];
        let widths = letters.map((c) => ctx.measureText(c).width);
        let tot = widths.reduce((p, q) => p + q + 3, 0);
        let cx = -tot / 2;
        srand(text.length * 997 + Math.floor(t * 6));
        for (let i = 0; i < letters.length; i++) {
          const ch = letters[i];
          const r =
            (hash(i * 31 + text.length) - 0.5) * 0.08 + (rnd() - 0.5) * 0.02;
          ctx.save();
          ctx.translate(cx + widths[i] / 2, (hash(i * 7) - 0.5) * 5);
          ctx.rotate(r);
          ctx.shadowColor = "rgba(255,215,230,0.95)";
          ctx.shadowBlur = 26;
          ctx.fillStyle = "#120c0b";
          ctx.textAlign = "center";
          ctx.fillText(ch, 0, 0);
          ctx.shadowBlur = 10;
          ctx.fillText(ch, 0, 0);
          ctx.restore();
          cx += widths[i] + 3;
        }
        ctx.restore();
      }

      // ---------- aisle scene ----------
      const VP = { x: 640, y: 318 },
        F = 235;
      function pr(X, Y, Z) {
        return [VP.x + (X * F) / Z, VP.y + (Y * F) / Z];
      }
      const PAL = [
        ["#c84b3a", "#efe6d6"],
        ["#3d5e8c", "#efe6d6"],
        ["#e0a63a", "#f3ead2"],
        ["#7f9a5a", "#efe6d6"],
        ["#2f8c86", "#f0eadb"],
        ["#d47d3a", "#f2e8d6"],
        ["#b25f86", "#f0e6e0"],
        ["#e4c9a8", "#c84b3a"],
        ["#2b2b3a", "#8aa6c8"],
      ];
      function aisle(t, zombies, hero) {
        // ceiling
        ctx.fillStyle = "#5e5872";
        ctx.fillRect(0, 0, W, H);
        let g = ctx.createLinearGradient(0, 0, 0, VP.y);
        g.addColorStop(0, "#4d4862");
        g.addColorStop(1, "#827c92");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, VP.y);
        // floor
        g = ctx.createLinearGradient(0, VP.y, 0, H);
        g.addColorStop(0, "#efe3c4");
        g.addColorStop(1, "#d9c79f");
        ctx.fillStyle = g;
        ctx.fillRect(0, VP.y, W, H - VP.y);
        // floor tiles
        ctx.globalAlpha = 0.25;
        for (let z = 1.2; z < 14; z *= 1.18) {
          const a = pr(-3, 2.2, z),
            b = pr(3, 2.2, z);
          line([...a, ...b], 1.2, "#a8936a");
        }
        ctx.globalAlpha = 1;
        // ceiling lights
        for (let z = 1.6; z < 14; z += 1.3) {
          const a = pr(-0.7, -2.6, z),
            b = pr(0.7, -2.6, z),
            c = pr(0.7, -2.6, z + 0.5),
            d = pr(-0.7, -2.6, z + 0.5);
          poly([...a, ...b, ...c, ...d], "#f6f1e2", Math.max(1, 3 / z));
          for (const sx of [-2.1, 2.1]) {
            const a = pr(sx - 0.4, -2.6, z),
              b = pr(sx + 0.4, -2.6, z),
              c = pr(sx + 0.4, -2.6, z + 0.4),
              d = pr(sx - 0.4, -2.6, z + 0.4);
            poly([...a, ...b, ...c, ...d], "#ece6d2", Math.max(1, 3 / z));
          }
        }
        // far wall
        const fw1 = pr(-3, -1.8, 14),
          fw2 = pr(3, 2.2, 14);
        rectP(fw1[0], fw1[1], fw2[0] - fw1[0], fw2[1] - fw1[1], "#f3efe4", 2);
        const s1 = pr(-2.4, -1.5, 13.9),
          s2 = pr(2.4, -0.9, 13.9);
        rectP(s1[0], s1[1], s2[0] - s1[0], s2[1] - s1[1], "#2f8c86", 1.5);
        ctx.fillStyle = "#f3ead2";
        ctx.font = "800 13px Inter";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("DAIRY · CHILL", (s1[0] + s2[0]) / 2, (s1[1] + s2[1]) / 2);
        // shelves
        for (const side of [-1, 1]) {
          const X = side * 3;
          for (let z = 13.6; z >= 1.0; z -= 0.42) {
            // far to near
            const z2 = z + 0.42;
            // backing
            const q = [
              ...pr(X, -1.7, z),
              ...pr(X, -1.7, z2),
              ...pr(X, 2.2, z2),
              ...pr(X, 2.2, z),
            ];
            poly(q, "#8a7a66", 0);
            for (let li = 0; li < 5; li++) {
              const Y = -1.25 + li * 0.82;
              const hsh = hash(
                Math.floor(z * 10) * 13 + li * 7 + (side > 0 ? 999 : 0),
              );
              const pal = PAL[Math.floor(hsh * PAL.length)];
              for (let k = 0; k < 3; k++) {
                const za = z + 0.03 + k * 0.13,
                  zb = za + 0.11;
                const bq = [
                  ...pr(X, Y - 0.55, za),
                  ...pr(X, Y - 0.55, zb),
                  ...pr(X, Y, zb),
                  ...pr(X, Y, za),
                ];
                poly(bq, pal[0], z < 5 ? 1 : 0);
                const bq2 = [
                  ...pr(X, Y - 0.4, za + 0.02),
                  ...pr(X, Y - 0.4, zb - 0.02),
                  ...pr(X, Y - 0.28, zb - 0.02),
                  ...pr(X, Y - 0.28, za + 0.02),
                ];
                poly(bq2, pal[1], 0);
              }
              const sq = [
                ...pr(X, Y, z),
                ...pr(X, Y, z2),
                ...pr(X, Y + 0.12, z2),
                ...pr(X, Y + 0.12, z),
              ];
              poly(sq, "#eee6d2", z < 6 ? 1.2 : 0);
              if (hash(Math.floor(z * 10) + li) > 0.6) {
                const tg = [
                  ...pr(X, Y + 0.02, z + 0.15),
                  ...pr(X, Y + 0.02, z + 0.25),
                  ...pr(X, Y + 0.1, z + 0.25),
                  ...pr(X, Y + 0.1, z + 0.15),
                ];
                poly(tg, "#e8c64a", 0);
              }
            }
            if (Math.abs((z - 1) % 2.1) < 0.42) {
              line([...pr(X, -1.7, z), ...pr(X, 2.2, z)], Math.max(1, 4 / z));
            }
          }
          // top edge
          line([...pr(X, -1.7, 1), ...pr(X, -1.7, 14)], 2);
          line([...pr(X, 2.2, 1), ...pr(X, 2.2, 14)], 2);
          // header boxes
          for (let z = 2; z < 12; z += 2.6) {
            const q = [
              ...pr(X, -2.3, z),
              ...pr(X, -2.3, z + 0.6),
              ...pr(X, -1.7, z + 0.6),
              ...pr(X, -1.7, z),
            ];
            poly(q, "#c9a978", Math.max(1, 3 / z));
          }
        }
        // hanging sign
        const hs1 = pr(-0.9, -2.15, 3.2),
          hs2 = pr(0.9, -1.6, 3.2);
        line([hs1[0] + 20, pr(0, -2.6, 3.2)[1], hs1[0] + 20, hs1[1]], 1.5);
        line([hs2[0] - 20, pr(0, -2.6, 3.2)[1], hs2[0] - 20, hs1[1]], 1.5);
        rectP(hs1[0], hs1[1], hs2[0] - hs1[0], hs2[1] - hs1[1], "#2f8c86", 3);
        circ(hs1[0] + 28, (hs1[1] + hs2[1]) / 2, 17, "#eae5d4", 2.5);
        ctx.fillStyle = "#2f8c86";
        ctx.font = "900 20px Inter";
        ctx.textAlign = "center";
        ctx.fillText("7", hs1[0] + 28, (hs1[1] + hs2[1]) / 2 + 1);
        ctx.fillStyle = "#f3ead2";
        ctx.font = "800 16px Inter";
        ctx.textAlign = "left";
        ctx.fillText("CANNED GOODS", hs1[0] + 54, (hs1[1] + hs2[1]) / 2 - 10);
        ctx.fillText("SOUP · BEANS", hs1[0] + 54, (hs1[1] + hs2[1]) / 2 + 12);
        // characters sorted far->near
        const list = [...zombies.map((z) => ({ ...z })), hero]
          .filter(Boolean)
          .sort((a, b) => b.Z - a.Z);
        for (const c of list) {
          const [sx, sy] = pr(c.X, 2.2, c.Z);
          const sc = F / c.Z;
          // shadow
          ctx.fillStyle = "rgba(60,40,20,.18)";
          ctx.beginPath();
          ctx.ellipse(sx, sy, 0.35 * sc, 0.06 * sc, 0, 0, Math.PI * 2);
          ctx.fill();
          if (c.cart) {
            drawCart(c, sx, sy, sc);
          }
          stick({ ...c, x: sx, y: sy, s: sc });
          if (c.after) c.after(sx, sy, sc);
        }
      }
      function drawCart(c, sx, sy, sc) {
        const x = sx - 0.95 * sc,
          y = sy;
        const lw = Math.max(1.5, sc * 0.03);
        line(
          [
            x,
            y - 0.12 * sc,
            x,
            y - 1.25 * sc,
            x + 0.55 * sc,
            y - 1.25 * sc,
            x + 0.55 * sc,
            y - 0.12 * sc,
          ],
          lw,
          "#5a5a5e",
        );
        line(
          [x - 0.03 * sc, y - 0.18 * sc, x + 0.58 * sc, y - 0.18 * sc],
          lw,
          "#5a5a5e",
        );
        for (let i = 0; i < 3; i++) {
          rectP(
            x + 0.03 * sc,
            y - (0.5 + i * 0.33) * sc,
            0.5 * sc,
            0.3 * sc,
            "#c9a272",
            lw * 0.9,
          );
          line(
            [
              x + 0.12 * sc,
              y - (0.37 + i * 0.33) * sc,
              x + 0.42 * sc,
              y - (0.37 + i * 0.33) * sc,
            ],
            lw * 0.5,
          );
        }
        circ(x + 0.05 * sc, y - 0.06 * sc, 0.06 * sc, "#3a3236", lw * 0.6);
        circ(x + 0.5 * sc, y - 0.06 * sc, 0.06 * sc, "#3a3236", lw * 0.6);
      }

      // ---------- roof scene ----------
      function roof(t, lt) {
        let g = ctx.createLinearGradient(0, 0, 0, 460);
        g.addColorStop(0, "#0c1230");
        g.addColorStop(1, "#1d2a5a");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        srand(777);
        for (let i = 0; i < 90; i++) {
          const x = rnd() * W,
            y = rnd() * 400,
            r = rnd() * 1.3 + 0.3;
          ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 3 + i);
          ctx.fillStyle = "#cfd6ff";
          ctx.fillRect(x, y, r, r);
        }
        ctx.globalAlpha = 1;
        srand(9000 + boil * 31);
        const mg = ctx.createRadialGradient(1060, 110, 30, 1060, 110, 190);
        mg.addColorStop(0, "rgba(170,180,230,.35)");
        mg.addColorStop(1, "rgba(170,180,230,0)");
        ctx.fillStyle = mg;
        ctx.fillRect(800, 0, 480, 360);
        circ(1060, 110, 40, "#cfcfcc", 3);
        circ(1046, 100, 7, "#b9b9b6", 0);
        circ(1074, 122, 5, "#b9b9b6", 0);
        // city
        const bl = [
          [0, 300, 90],
          [80, 340, 170],
          [240, 280, 110],
          [340, 360, 130],
          [460, 310, 100],
          [560, 330, 150],
          [700, 290, 120],
          [810, 350, 170],
          [960, 300, 90],
          [1040, 270, 130],
          [1160, 320, 130],
        ];
        for (const [b, h, w] of bl) {
          rectP(b, h, w, 470 - h, "#161c3a", 2);
          srand(b);
          for (let i = 0; i < 8; i++) {
            if (rnd() > 0.55) {
              ctx.fillStyle = "rgba(240,200,120,.5)";
              ctx.fillRect(
                b + 10 + rnd() * (w - 25),
                h + 15 + rnd() * (400 - h),
                7,
                9,
              );
            }
          }
        }
        srand(9100 + boil * 31);
        // parapet & floor
        rectP(-10, 430, W + 20, 48, "#3d4466", 3);
        line([-10, 452, W + 10, 452], 2);
        g = ctx.createLinearGradient(0, 478, 0, H);
        g.addColorStop(0, "#323a5e");
        g.addColorStop(1, "#262c48");
        ctx.fillStyle = g;
        ctx.fillRect(0, 478, W, H);
        ctx.globalAlpha = 0.3;
        for (let i = 0; i < 7; i++)
          line([i * 220 - 100, H, i * 190 + 40, 478], 1.2, "#1a1f38");
        ctx.globalAlpha = 1;
        // spotlight
        const sg = ctx.createRadialGradient(520, 560, 10, 520, 560, 260);
        sg.addColorStop(0, "rgba(190,200,255,.28)");
        sg.addColorStop(1, "rgba(190,200,255,0)");
        ctx.fillStyle = sg;
        ctx.fillRect(200, 300, 700, 420);
        // props
        rectP(300, 520, 24, 70, "#9da2b8", 3);
        poly([292, 522, 332, 522, 326, 506, 298, 506], "#9da2b8", 3);
        rectP(640, 535, 130, 50, "#c7cad8", 3);
        rectP(1010, 470, 200, 120, "#c4c7d6", 3);
        for (let i = 0; i < 7; i++)
          line([1015, 500 + i * 12, 1205, 500 + i * 12], 1.5);
        ctx.beginPath();
        ctx.ellipse(1110, 478, 70, 7, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#9aa0b6";
        ctx.fill();
        // hero throw
        const k = lt; // seconds into scene
        let arm;
        const rel = 1.3;
        if (k < 0.6) arm = lerp(0.3, -2.6, ease(k / 0.6));
        else if (k < rel) arm = lerp(-2.6, -2.9, ease((k - 0.6) / 0.4));
        else arm = lerp(-2.9, 2.2, ease((k - rel) / 0.25));
        const handPos = {};
        // ground shadow
        ctx.fillStyle = "rgba(10,10,30,.35)";
        ctx.beginPath();
        ctx.ellipse(500, 560, 45, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        const turn = k > 3.4;
        stick({
          x: 500,
          y: 560,
          s: 112,
          face: turn ? -1 : 1,
          kind: "hero",
          cloth: "#2f9c95",
          armUp: turn ? null : arm,
          elbow: -0.4,
          look: turn ? -1 : 1,
          breath: Math.sin(t * 3) * 0.01,
          hold: (h) => {
            handPos.x = h[0];
            handPos.y = h[1];
          },
        });
        // clock path
        const p0 = { x: 540, y: 390 },
          p1 = { x: 880, y: 90 },
          p2 = { x: 1300, y: 300 };
        const bez = (u) => ({
          x: (1 - u) * (1 - u) * p0.x + 2 * (1 - u) * u * p1.x + u * u * p2.x,
          y: (1 - u) * (1 - u) * p0.y + 2 * (1 - u) * u * p1.y + u * u * p2.y,
        });
        const u = clamp((k - rel - 0.15) / 1.4, 0, 1);
        if (k < rel + 0.15) {
          if (handPos.x) drawClock(handPos.x, handPos.y, 13, 0, false);
        } else {
          ctx.setLineDash([12, 10]);
          ctx.lineWidth = 3;
          ctx.strokeStyle = "rgba(220,225,240,.85)";
          ctx.beginPath();
          for (let i = 0; i <= 40; i++) {
            const q = bez((i / 40) * u);
            i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y);
          }
          ctx.stroke();
          ctx.setLineDash([]);
          if (u < 1) {
            const q = bez(u);
            drawClock(q.x, q.y, 22, k * 9, false);
          }
        }
        // ringing offscreen
        if (k > 3.0) {
          const r = k - 3.0;
          ctx.save();
          ctx.translate(1235, 330);
          for (let i = 0; i < 3; i++) {
            const a = (r * 2 + i / 3) % 1;
            ctx.globalAlpha = 1 - a;
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#f1d36a";
            ctx.beginPath();
            ctx.arc(0, 0, 20 + a * 70, Math.PI * 0.55, Math.PI * 1.45);
            ctx.stroke();
          }
          ctx.restore();
          ctx.globalAlpha = 1;
        }
      }
      function drawClock(x, y, r, rot, ring) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        circ(-r * 0.6, -r * 0.85, r * 0.35, "#d9a441", 2);
        circ(r * 0.6, -r * 0.85, r * 0.35, "#d9a441", 2);
        line([-r * 0.6, r * 0.9, -r * 0.9, r * 1.3], 2.5);
        line([r * 0.6, r * 0.9, r * 0.9, r * 1.3], 2.5);
        circ(0, 0, r, "#d2453a", 3);
        circ(0, 0, r * 0.75, "#f2efe6", 2);
        line([0, 0, 0, -r * 0.55], 2);
        line([0, 0, r * 0.35, r * 0.1], 2);
        ctx.restore();
      }

      // ---------- timeline ----------
      const ZOMB = [
        { X: -0.9, cloth: "#c7b48e", hair: "#6b4a35", ph: 0.3, d: 0.0 },
        { X: 0.4, cloth: "#8fa38c", ph: 1.1, d: 0.25 },
        { X: 1.3, cloth: "#e2c04a", ph: 2.0, d: 0.6, hair: "#4c5a44" },
        { X: -1.7, cloth: "#9c8f80", ph: 0.7, d: 0.9 },
        { X: -0.2, cloth: "#d9d4c6", ph: 2.6, d: 1.2, hair: "#3d3a4c" },
        { X: 2.0, cloth: "#b79a76", ph: 1.5, d: 1.4 },
        { X: -2.2, cloth: "#7f9bb4", ph: 0.1, d: 1.7 },
        { X: 0.9, cloth: "#c8b8a0", ph: 2.2, d: 1.9, hair: "#6b4a35" },
      ];
      function render(t) {
        boil = Math.floor(t * 8);
        srand(1234 + boil * 7919);
        ctx.save();
        ctx.clearRect(0, 0, W, H);
        if (t < 10) {
          const push = 1 + 0.05 * ease(t / 10);
          ctx.translate(W / 2, H / 2);
          ctx.scale(push, push);
          ctx.translate(-W / 2, -H / 2);
          const startled = t > 6.3;
          const lk = t > 5.6 ? -1 : 1;
          let armUp = -2.4 + Math.sin(t * 2.2) * 0.15;
          if (t > 3.2 && t < 4.0)
            armUp = lerp(-2.4, -2.9, Math.sin(((t - 3.2) / 0.8) * Math.PI));
          let holdCan = t < 6.5;
          const hero = {
            X: 0.8,
            Z: 2.25,
            kind: "hero",
            cloth: "#2f9c95",
            face: startled ? -1 : 1,
            cart: true,
            look: lk,
            armUp: startled
              ? t < 7
                ? lerp(-2.4, -2.9, ease((t - 6.3) / 0.3))
                : -2.9 + Math.sin(t * 20) * 0.05
              : armUp,
            elbow: 0.3,
            breath: Math.sin(t * 2.5) * 0.01,
            hold: (h) => {
              if (holdCan) {
                ctx.save();
                rectP(h[0] - 10, h[1] - 24, 20, 24, "#c84b3a", 2.5);
                ctx.fillStyle = "#efe6d6";
                ctx.fillRect(h[0] - 8, h[1] - 16, 16, 6);
                ctx.restore();
              }
            },
            after: (sx, sy, sc) => {
              if (t > 6.3) {
                const k = t - 6.3;
                const s = backOut(k / 0.3);
                ctx.save();
                ctx.translate(
                  sx + 0.05 * sc * (startled ? -1 : 1),
                  sy - 2.25 * sc,
                );
                ctx.scale(s, s);
                ctx.font = "900 64px Inter";
                ctx.textAlign = "center";
                ctx.fillStyle = "#f3ead2";
                ctx.lineWidth = 7;
                ctx.strokeStyle = INK;
                ctx.strokeText("!", 0, 0);
                ctx.fillText("!", 0, 0);
                ctx.restore();
              }
              if (t > 6.5) {
                const k = clamp((t - 6.5) / 0.35, 0, 1);
                const cx = sx + 0.5 * sc,
                  cy = lerp(sy - 1.9 * sc, sy - 0.12 * sc, k * k);
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(k * 2.2);
                rectP(-9, -11, 18, 22, "#c84b3a", 2.5);
                ctx.restore();
              }
            },
          };
          let zs = [];
          if (t > 4.6) {
            const k = t - 4.6;
            zs = ZOMB.map((z, i) => {
              const kk = Math.max(0, k - z.d);
              return {
                X: z.X,
                Z: Math.max(4.3 + i * 0.4, 13.5 - kk * 2.1),
                kind: "zombie",
                cloth: z.cloth,
                hair: z.hair,
                walk: kk * 4.2 + z.ph,
                face: z.X > 0.6 ? -1 : 1,
                mouth: 1 + 0.3 * Math.sin(t * 5 + i),
              };
            }).filter((z, i) => k > ZOMB[i].d);
            zs.forEach((z) => (z.face = 1));
          }
          // lights flicker in scene 2
          aisle(t, zs, hero);
          ctx.fillStyle = 'rgba(120,100,110,.16)';
          ctx.fillRect(0, 0, W, H);
          if (t > 5.0) {
            const fl =
              Math.sin(t * 37) > 0.85 || (t > 7.6 && t < 7.75) ? 0.35 : 0;
            const dk = 0.12 + fl;
            ctx.fillStyle = `rgba(20,15,40,${dk})`;
            ctx.fillRect(0, 0, W, H);
          }
        } else {
          roof(t, t - 10);
        }
        ctx.restore();
        // haze + vignette
        const vg = ctx.createRadialGradient(
          W / 2,
          H / 2,
          H * 0.35,
          W / 2,
          H / 2,
          H * 0.95,
        );
        vg.addColorStop(0, "rgba(0,0,0,0)");
        vg.addColorStop(1, "rgba(10,6,20,.55)");
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
        // captions
        if (t < 4.6) caption("SUPERMARKET", 0.4, t);
        else if (t < 10) caption("LIGHTS ON", 5.0, t);
        else if (t < 13.2) caption("ROOF", 10.4, t);
        else caption("DECOY", 13.3, t);
        // grain
        srand(boil * 13 + 5);
        ctx.globalAlpha = 0.05;
        for (let i = 0; i < 600; i++) {
          ctx.fillStyle = rnd() > 0.5 ? "#fff" : "#000";
          ctx.fillRect(rnd() * W, rnd() * H, 2, 2);
        }
        ctx.globalAlpha = 1;
        // transitions
        let fade = 0;
        if (t < 0.4) fade = 1 - t / 0.4;
        if (t > 9.75 && t < 10) fade = (t - 9.75) / 0.25;
        if (t >= 10 && t < 10.3) fade = 1 - (t - 10) / 0.3;
        if (t > 14.6) fade = (t - 14.6) / 0.4;
        if (fade > 0) {
          ctx.fillStyle = `rgba(0,0,0,${clamp(fade, 0, 1)})`;
          ctx.fillRect(0, 0, W, H);
        }
      }
      window.render = render;
      document.fonts.load("900 78px Inter").then(() => {
        window.ready = true;
        render(0);
      });
    </script>
  </body>
</html>
