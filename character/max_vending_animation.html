<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1280" height="720"></canvas>
    <script>
      const W = 1280,
        H = 720,
        ctx = document.getElementById("c").getContext("2d"),
        INK = "#2a1f1a";
      let seed = 7;
      function srand(s) {
        seed = s >>> 0 || 1;
      }
      function rnd() {
        seed ^= seed << 13;
        seed >>>= 0;
        seed ^= seed >> 17;
        seed ^= seed << 5;
        seed >>>= 0;
        return seed / 4294967296;
      }
      const J = 1.2,
        jx = (v) => v + (rnd() - 0.5) * J;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v)),
        lerp = (a, b, t) => a + (b - a) * t;
      const ease = (t) => {
        t = clamp(t, 0, 1);
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      };
      const backOut = (t) => {
        t = clamp(t, 0, 1);
        const c = 1.7;
        return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
      };
      function line(p, w, c = INK) {
        ctx.beginPath();
        ctx.moveTo(jx(p[0]), jx(p[1]));
        for (let i = 2; i < p.length; i += 2)
          ctx.lineTo(jx(p[i]), jx(p[i + 1]));
        ctx.lineWidth = w;
        ctx.strokeStyle = c;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
      }
      function poly(p, f, w) {
        ctx.beginPath();
        ctx.moveTo(jx(p[0]), jx(p[1]));
        for (let i = 2; i < p.length; i += 2)
          ctx.lineTo(jx(p[i]), jx(p[i + 1]));
        ctx.closePath();
        if (f) {
          ctx.fillStyle = f;
          ctx.fill();
        }
        if (w) {
          ctx.lineWidth = w;
          ctx.strokeStyle = INK;
          ctx.lineJoin = "round";
          ctx.stroke();
        }
      }
      function rect(x, y, w, h, f, lw) {
        poly([x, y, x + w, y, x + w, y + h, x, y + h], f, lw);
      }
      function circ(x, y, r, f, w) {
        ctx.beginPath();
        ctx.arc(jx(x), jx(y), r, 0, Math.PI * 2);
        if (f) {
          ctx.fillStyle = f;
          ctx.fill();
        }
        if (w) {
          ctx.lineWidth = w;
          ctx.strokeStyle = INK;
          ctx.stroke();
        }
      }
      function curve(x1, y1, cx, cy, x2, y2, w) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo(cx, cy, x2, y2);
        ctx.lineWidth = w;
        ctx.strokeStyle = INK;
        ctx.lineCap = "round";
        ctx.stroke();
      }

      // ---------- Max head ----------
      function head(x, y, r, e, lw, look = 0, blink = false) {
        circ(x, y, r, "#f1f0eb", lw);
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, r - lw / 2, 0, Math.PI * 2);
        ctx.clip();
        poly(
          [
            x - r,
            y - r * 0.62,
            x + r,
            y - r * 0.7,
            x + r,
            y - r * 0.36,
            x - r,
            y - r * 0.28,
          ],
          "#d8443a",
          0,
        );
        ctx.fillStyle = "rgba(255,255,255,.6)";
        for (const [dx, dy] of [
          [-0.5, -0.45],
          [0, -0.5],
          [0.5, -0.52],
        ]) {
          ctx.beginPath();
          ctx.arc(x + dx * r, y + dy * r, r * 0.05, 0, 7);
          ctx.fill();
        }
        ctx.restore();
        line(
          [x - r * 0.98, y - r * 0.28, x + r * 0.98, y - r * 0.36],
          lw * 0.8,
        );
        line([x - r * 0.9, y - r * 0.62, x + r * 0.9, y - r * 0.7], lw * 0.8);
        poly(
          [
            x - r * 0.95,
            y - r * 0.5,
            x - r * 1.45,
            y - r * 0.75,
            x - r * 1.35,
            y - r * 0.45,
          ],
          "#d8443a",
          lw * 0.8,
        );
        poly(
          [
            x - r * 0.95,
            y - r * 0.45,
            x - r * 1.4,
            y - r * 0.2,
            x - r * 1.2,
            y - r * 0.05,
          ],
          "#d8443a",
          lw * 0.8,
        );
        const ex = r * 0.33,
          ey = y - r * 0.02,
          er = r * 0.2;
        const E = {
          neutral: { o: 1, b: [0, 0] },
          scared: { o: 1.3, b: [-0.2, 0.2] },
          angry: { o: 0.8, b: [0.25, -0.25] },
          smirk: { o: 0.75, b: [-0.05, 0.15] },
          tired: { o: 0.6, b: [0, 0] },
          happy: { o: 1, b: [-0.08, 0.08] },
        }[e];
        for (const s of [-1, 1]) {
          const cx = x + s * ex + look * r * 0.08;
          if (blink) {
            line([cx - er, ey, cx + er, ey], lw * 0.7);
          } else {
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(cx, ey, er, er * E.o, 0, 0, 7);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.lineWidth = lw * 0.7;
            ctx.strokeStyle = INK;
            ctx.stroke();
            ctx.clip();
            circ(
              cx + look * er * 0.45,
              ey + (e === "scared" ? 0 : er * 0.1),
              er * (e === "scared" ? 0.35 : 0.55),
              "#15100e",
              0,
            );
            if (e === "tired") {
              ctx.fillStyle = "#f1f0eb";
              ctx.fillRect(cx - er, ey - er, er * 2, er * 0.8);
            }
            ctx.restore();
            if (e === "tired")
              line([cx - er, ey - er * 0.2, cx + er, ey - er * 0.2], lw * 0.6);
          }
          const by = ey - er * 1.45,
            tilt = s < 0 ? E.b[0] : E.b[1];
          line(
            [
              cx - er * 0.9,
              by + (s < 0 ? tilt : -tilt) * er * -1.2,
              cx + er * 0.9,
              by + (s < 0 ? -tilt : tilt) * er * -1.2,
            ],
            lw * 0.9,
          );
        }
        const my = y + r * 0.48,
          mx = x + look * r * 0.06;
        if (e === "neutral")
          line([mx - r * 0.15, my, mx + r * 0.15, my], lw * 0.8);
        if (e === "scared") {
          ctx.beginPath();
          ctx.ellipse(mx, my + r * 0.03, r * 0.12, r * 0.17, 0, 0, 7);
          ctx.fillStyle = "#1a1210";
          ctx.fill();
        }
        if (e === "angry") {
          poly(
            [
              mx - r * 0.2,
              my + r * 0.05,
              mx + r * 0.2,
              my + r * 0.05,
              mx + r * 0.15,
              my - r * 0.07,
              mx - r * 0.15,
              my - r * 0.07,
            ],
            "#f2efe6",
            lw * 0.7,
          );
        }
        if (e === "smirk")
          curve(
            mx - r * 0.18,
            my,
            mx + r * 0.05,
            my + r * 0.08,
            mx + r * 0.22,
            my - r * 0.1,
            lw * 0.8,
          );
        if (e === "happy")
          curve(
            mx - r * 0.18,
            my - r * 0.04,
            mx,
            my + r * 0.16,
            mx + r * 0.18,
            my - r * 0.04,
            lw * 0.8,
          );
        if (e === "tired")
          curve(
            mx - r * 0.15,
            my + r * 0.04,
            mx,
            my - r * 0.04,
            mx + r * 0.15,
            my + r * 0.04,
            lw * 0.8,
          );
        ctx.save();
        ctx.translate(x - r * 0.55, y + r * 0.3);
        ctx.rotate(-0.4);
        poly(
          [
            -r * 0.14,
            -r * 0.06,
            r * 0.14,
            -r * 0.06,
            r * 0.14,
            r * 0.06,
            -r * 0.14,
            r * 0.06,
          ],
          "#ecc48f",
          lw * 0.5,
        );
        ctx.restore();
      }
      function bat(x, y, s, rot, lw) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        poly(
          [
            -0.025 * s,
            0.05 * s,
            0.025 * s,
            0.05 * s,
            0.06 * s,
            -0.8 * s,
            -0.06 * s,
            -0.8 * s,
          ],
          "#d6a35e",
          lw * 0.8,
        );
        for (let i = 0; i < 3; i++)
          line(
            [-0.03 * s, (0.0 - i * 0.05) * s, 0.03 * s, (-0.02 - i * 0.05) * s],
            lw * 0.6,
            "#ece6d6",
          );
        ctx.restore();
      }
      // o: {x,y,s,e,walk,batRot,armA,look,blink,chips}
      function max(o) {
        const s = o.s,
          x = o.x,
          lw = Math.max(3, s * 0.045);
        const bob = o.walk != null ? -Math.abs(Math.cos(o.walk)) * 0.03 : 0,
          y = o.y;
        const P = (u, v) => [x + u * s, y + (v + (v < -0.5 ? bob : 0)) * s];
        poly(
          [
            ...P(-0.27, -1.38),
            ...P(0.27, -1.38),
            ...P(0.3, -0.8),
            ...P(-0.3, -0.8),
          ],
          "#7a6544",
          lw,
        );
        let l1 = 0,
          l2 = 0;
        if (o.walk != null) {
          l1 = Math.sin(o.walk) * 0.2;
          l2 = -l1;
        }
        line(
          [
            ...P(0, -0.78),
            ...P(-0.08 + l1, -0.4),
            ...P(-0.12 + l1 * 1.5, 0),
            ...P(-0.02 + l1 * 1.5, 0),
          ],
          lw,
        );
        line(
          [
            ...P(0, -0.78),
            ...P(0.08 + l2, -0.4),
            ...P(0.12 + l2 * 1.5, 0),
            ...P(0.22 + l2 * 1.5, 0),
          ],
          lw,
        );
        poly(
          [
            ...P(-0.2, -1.42),
            ...P(0.2, -1.42),
            ...P(0.24, -0.66),
            ...P(-0.24, -0.66),
          ],
          "#7d8f4e",
          lw,
        );
        line([...P(0, -1.42), ...P(0, -0.66)], lw * 0.6);
        poly(
          [
            ...P(0.06, -1.0),
            ...P(0.17, -1.0),
            ...P(0.17, -0.88),
            ...P(0.06, -0.88),
          ],
          null,
          lw * 0.6,
        );
        line([...P(-0.15, -1.42), ...P(-0.12, -0.95)], lw * 0.9, "#4a3c28");
        line([...P(0.15, -1.42), ...P(0.12, -0.95)], lw * 0.9, "#4a3c28");
        const sh = P(0, -1.38);
        // left arm
        if (o.chips) {
          const h = P(-0.42, -1.3);
          line([...sh, ...P(-0.3, -1.15), ...h], lw);
          chips(h[0], h[1] - 0.06 * s, s * 0.9, lw);
        } else
          line(
            [
              ...sh,
              ...P(-0.22 - l1 * 0.5, -1.05),
              ...P(-0.28 - l1 * 0.8, -0.8),
            ],
            lw,
          );
        // right arm with bat
        const a = o.armA ?? 0.25; // angle from down, positive = forward(right)
        const el = [
            sh[0] + Math.sin(a * 0.8) * 0.3 * s,
            sh[1] + Math.cos(a * 0.8) * 0.3 * s,
          ],
          hd = [sh[0] + Math.sin(a) * 0.58 * s, sh[1] + Math.cos(a) * 0.58 * s];
        line([...sh, ...el, ...hd], lw);
        bat(hd[0], hd[1], s, o.batRot ?? 2.9, lw);
        head(...P(0, -1.75), 0.34 * s, o.e, lw, o.look || 0, o.blink);
      }
      function chips(x, y, s, lw) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-0.15);
        poly(
          [
            -0.13 * s,
            -0.18 * s,
            0.13 * s,
            -0.18 * s,
            0.15 * s,
            0.18 * s,
            -0.15 * s,
            0.18 * s,
          ],
          "#f2c33a",
          lw * 0.7,
        );
        circ(0, 0, 0.07 * s, "#d8443a", lw * 0.4);
        ctx.restore();
      }
      // zombie
      function zombie(o) {
        const s = o.s,
          x = o.x,
          y = o.y,
          lw = Math.max(3, s * 0.045);
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(o.rot || 0);
        const P = (u, v) => [u * s, v * s];
        const w = o.walk || 0,
          l1 = Math.sin(w) * 0.16;
        line(
          [
            ...P(0, -0.78),
            ...P(0.05 + l1, -0.4),
            ...P(0.1 + l1 * 1.5, 0),
            ...P(0.0 + l1 * 1.5, 0),
          ],
          lw,
        );
        line(
          [
            ...P(0, -0.78),
            ...P(-0.05 - l1, -0.4),
            ...P(-0.1 - l1 * 1.5, 0),
            ...P(-0.2 - l1 * 1.5, 0),
          ],
          lw,
        );
        line(
          [
            ...P(0, -1.36),
            ...P(-0.35, -1.2 + Math.sin(w * 0.7) * 0.04),
            ...P(-0.62, -1.22),
          ],
          lw,
        );
        poly(
          [
            ...P(-0.18, -1.42),
            ...P(0.18, -1.42),
            ...P(0.22, -0.66),
            ...P(0.05, -0.6),
            ...P(-0.05, -0.7),
            ...P(-0.22, -0.62),
          ],
          "#6c8fb8",
          lw,
        );
        line(
          [
            ...P(0, -1.36),
            ...P(-0.38, -1.12 + Math.cos(w * 0.7) * 0.04),
            ...P(-0.66, -1.14),
          ],
          lw,
        );
        const hc = P(-0.04, -1.75),
          r = 0.32 * s;
        circ(hc[0], hc[1], r, "#a9c08f", lw);
        ctx.save();
        ctx.beginPath();
        ctx.arc(hc[0], hc[1], r - lw / 2, 0, 7);
        ctx.clip();
        ctx.fillStyle = "rgba(80,110,70,.35)";
        ctx.beginPath();
        ctx.ellipse(
          hc[0] - r * 0.1,
          hc[1] + r * 0.55,
          r * 0.8,
          r * 0.45,
          0,
          0,
          7,
        );
        ctx.fill();
        ctx.restore();
        poly(
          [
            hc[0] - r * 0.9,
            hc[1] - r * 0.5,
            hc[0] - r * 0.5,
            hc[1] - r * 1.05,
            hc[0] + r * 0.3,
            hc[1] - r * 1.1,
            hc[0] + r * 0.85,
            hc[1] - r * 0.6,
            hc[0] + r * 0.3,
            hc[1] - r * 0.75,
          ],
          "#5d4a3a",
          lw * 0.8,
        );
        for (const s2 of [-1, 1]) {
          const ex = hc[0] + s2 * r * 0.33 - r * 0.12,
            ey = hc[1];
          circ(ex, ey, r * 0.21, "#f6f3e4", lw * 0.7);
          circ(ex - r * 0.05, ey + r * 0.03, r * 0.08, "#15100e", 0);
        }
        ctx.beginPath();
        ctx.ellipse(
          hc[0] - r * 0.12,
          hc[1] + r * 0.48,
          r * 0.14,
          r * 0.2 * (o.mouth || 1),
          0,
          0,
          7,
        );
        ctx.fillStyle = "#2a1512";
        ctx.fill();
        ctx.restore();
      }

      // ---------- background ----------
      function bg(t, shake) {
        let g = ctx.createLinearGradient(0, 0, 0, 470);
        g.addColorStop(0, "#f6b98f");
        g.addColorStop(1, "#fbe2c3");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        circ(1050, 120, 52, "#fff3d6", 0);
        ctx.fillStyle = "rgba(255,255,255,.45)";
        for (const [x, y, w] of [
          [180, 120, 260],
          [700, 80, 320],
          [980, 200, 240],
        ]) {
          ctx.beginPath();
          ctx.ellipse(x + Math.sin(t * 0.2) * 10, y, w / 2, 18, 0, 0, 7);
          ctx.fill();
        }
        // smoke
        for (const [x, h] of [
          [300, 260],
          [920, 220],
        ]) {
          ctx.fillStyle = "rgba(110,90,100,.35)";
          ctx.beginPath();
          ctx.moveTo(x - 20, 470);
          ctx.bezierCurveTo(
            x - 30,
            300,
            x + 40 + Math.sin(t) * 10,
            200,
            x + 60,
            470 - h - 80,
          );
          ctx.lineTo(x + 120, 470 - h - 90);
          ctx.bezierCurveTo(x + 60, 220, x + 20, 330, x + 25, 470);
          ctx.fill();
        }
        srand(55 + Math.floor(t * 8) * 7);
        const bl = [
          [0, 280, 110],
          [100, 320, 140],
          [230, 250, 120],
          [340, 300, 150],
          [480, 230, 110],
          [580, 290, 170],
          [740, 260, 130],
          [860, 310, 150],
          [1000, 240, 120],
          [1110, 290, 170],
        ];
        for (const [b, h, w] of bl) {
          rect(b, h, w, 470 - h, "#b8a3c9", 2.5);
          srand(b);
          for (let i = 0; i < 10; i++) {
            const wx = b + 12 + Math.floor(rnd() * ((w - 30) / 18)) * 18,
              wy = h + 15 + Math.floor(rnd() * ((440 - h) / 22)) * 22;
            ctx.fillStyle = rnd() > 0.7 ? "#8d79a3" : "#cdbcd9";
            ctx.fillRect(wx, wy, 9, 12);
          }
        }
        srand(91 + Math.floor(t * 8) * 13);
        // fence/sidewalk
        ctx.fillStyle = "#e9d9c0";
        ctx.fillRect(0, 470, W, 90);
        line([0, 470, W, 470], 3);
        ctx.fillStyle = "#cfc2b2";
        ctx.fillRect(0, 560, W, 160);
        line([0, 560, W, 560], 3);
        ctx.setLineDash([40, 30]);
        line([0, 650, W, 650], 5, "#f3ead2");
        ctx.setLineDash([]);
        for (let i = 0; i < 14; i++)
          line([i * 100, 470, i * 100 - 30, 560], 1.5, "rgba(42,31,26,.25)");
      }
      function car(x, y) {
        rect(x, y - 80, 300, 60, "#4ea3a0", 4);
        poly(
          [x + 50, y - 80, x + 90, y - 130, x + 210, y - 130, x + 250, y - 80],
          "#4ea3a0",
          4,
        );
        poly(
          [x + 65, y - 84, x + 97, y - 122, x + 145, y - 122, x + 145, y - 84],
          "#dff0ee",
          3,
        );
        poly(
          [
            x + 155,
            y - 84,
            x + 155,
            y - 122,
            x + 205,
            y - 122,
            x + 235,
            y - 84,
          ],
          "#dff0ee",
          3,
        );
        line([x + 110, y - 110, x + 130, y - 95], 2);
        line([x + 180, y - 118, x + 200, y - 100, x + 190, y - 90], 2);
        circ(x + 65, y - 18, 26, "#3a3236", 4);
        circ(x + 235, y - 18, 26, "#3a3236", 4);
        circ(x + 65, y - 18, 10, "#bdb6aa", 2);
        circ(x + 235, y - 18, 10, "#bdb6aa", 2);
      }
      function vending(x, y, drop) {
        rect(x, y - 260, 150, 260, "#d8443a", 4);
        rect(x + 15, y - 245, 90, 170, "#e9f3f5", 3);
        const cols = ["#f2c33a", "#4ea3a0", "#7d8f4e", "#e07b39", "#6c8fb8"];
        for (let r = 0; r < 5; r++)
          for (let c = 0; c < 3; c++) {
            if (r === 2 && c === 1 && drop > 0) continue;
            rect(
              x + 22 + c * 28,
              y - 238 + r * 33,
              20,
              24,
              cols[(r * 3 + c) % 5],
              2,
            );
            line([x + 18, y - 212 + r * 33, x + 102, y - 212 + r * 33], 2);
          }
        rect(x + 112, y - 230, 26, 60, "#f1f0eb", 2.5);
        for (let i = 0; i < 3; i++)
          circ(x + 125, y - 220 + i * 18, 5, "#2a1f1a", 0);
        rect(x + 20, y - 60, 90, 30, "#3a2c28", 3);
        ctx.font = "900 18px Inter";
        ctx.fillStyle = "#fff3d6";
        ctx.textAlign = "center";
        ctx.fillText("SNACKS", x + 75, y - 268 + 0);
        if (drop > 0 && drop < 1) {
          const yy = lerp(y - 170, y - 48, drop * drop);
          rect(x + 50, yy - 12, 20, 24, "#f2c33a", 2);
        }
      }

      // ---------- caption ----------
      function caption(text, t0, t) {
        const k = t - t0;
        if (k < 0) return;
        const a = clamp(k / 0.12, 0, 1),
          sc = lerp(0.6, 1, backOut(k / 0.35));
        ctx.save();
        ctx.translate(W / 2, 662);
        ctx.scale(sc, sc);
        ctx.globalAlpha = a;
        ctx.font = "900 76px Inter";
        ctx.textBaseline = "middle";
        ctx.textAlign = "center";
        const L = [...text],
          ws = L.map((c) => ctx.measureText(c).width),
          tot = ws.reduce((p, q) => p + q + 3, 0);
        let cx = -tot / 2;
        for (let i = 0; i < L.length; i++) {
          ctx.save();
          ctx.translate(cx + ws[i] / 2, Math.sin(i * 2.3) * 3);
          ctx.rotate(Math.sin(i * 1.7) * 0.04);
          ctx.shadowColor = "rgba(255,255,255,.95)";
          ctx.shadowBlur = 24;
          ctx.fillStyle = "#1a1210";
          ctx.fillText(L[i], 0, 0);
          ctx.shadowBlur = 8;
          ctx.fillText(L[i], 0, 0);
          ctx.restore();
          cx += ws[i] + 3;
        }
        ctx.restore();
      }

      function render(t) {
        srand(1000 + Math.floor(t * 8) * 7919);
        ctx.save();
        ctx.clearRect(0, 0, W, H);
        // camera
        let zoom = 1,
          cx = W / 2,
          cy = H / 2,
          shx = 0,
          shy = 0;
        if (t > 8.2 && t < 10.6) {
          const k = ease((t - 8.2) / 0.5);
          zoom = lerp(1, 1.45, k);
          cx = lerp(W / 2, 700, k);
          cy = lerp(H / 2, 380, k);
        }
        if (t >= 10.6) {
          const k = ease((t - 10.6) / 0.4);
          zoom = lerp(1.45, 1, k);
          cx = lerp(700, W / 2, k);
          cy = lerp(380, H / 2, k);
        }
        if (t > 10.95 && t < 11.3) {
          shx = (rnd() - 0.5) * 14;
          shy = (rnd() - 0.5) * 14;
        }
        ctx.translate(W / 2 + shx, H / 2 + shy);
        ctx.scale(zoom, zoom);
        ctx.translate(-cx, -cy);
        bg(t);
        vending(820, 555, t > 6.0 ? (t - 6.0) / 0.5 : 0);
        // zombie
        let zx = 1240,
          zy = 600,
          zr = 0,
          zs = 210,
          zwalk = t * 5;
        if (t < 6.8) zx = 1450;
        else if (t < 10.95) zx = lerp(1240, 940, clamp((t - 6.8) / 3.8, 0, 1));
        if (t >= 10.95) {
          const k = t - 10.95;
          zx = 940 + k * 900;
          zy = 600 - k * 900 + k * k * 900;
          zr = k * 9;
        }
        if (t >= 7.6) car(980, 640);
        if (t > 6.8 && t < 10.95) {
          const rise = clamp((t - 6.8) / 0.6, 0, 1);
          zy = lerp(700, 600, ease(rise));
        }
        zombie({
          x: zx,
          y: zy,
          s: zs,
          walk: zwalk,
          rot: zr,
          mouth: 1 + 0.3 * Math.sin(t * 6),
        });
        if (t < 7.6) car(980, 640);
        // Max
        let mx = 700,
          walk = null,
          e = "tired",
          look = 0,
          armA = 0.25,
          batRot = 2.9,
          chipsOn = false;
        if (t < 4.3) {
          mx = lerp(-120, 700, clamp(t / 3.8, 0, 1));
          walk = t < 3.8 ? t * 7 : null;
          e = "tired";
        } else if (t < 8.2) {
          e = t < 5.2 ? "neutral" : t < 6.6 ? "smirk" : "happy";
          look = 1;
          if (t > 5.5 && t < 6.0) {
            armA = lerp(0.25, 1.9, ease((t - 5.5) / 0.2));
          }
        } else if (t < 10.6) {
          e = "scared";
          look = 1;
          armA = lerp(0.25, -0.5, ease((t - 8.2) / 0.3));
          batRot = lerp(2.9, -0.6, ease((t - 8.2) / 0.3));
          chipsOn = true;
        } else {
          const k = t - 10.6;
          chipsOn = true;
          if (k < 0.35) {
            e = "angry";
            armA = lerp(-0.5, -2.6, ease(k / 0.35));
            batRot = lerp(-0.6, -3.6, ease(k / 0.35));
          } else if (k < 0.6) {
            e = "angry";
            armA = lerp(-2.6, 1.6, ease((k - 0.35) / 0.15));
            batRot = lerp(-3.6, 0.9, ease((k - 0.35) / 0.15));
          } else {
            e = "smirk";
            armA = lerp(1.6, 0.3, ease((k - 0.6) / 0.5));
            batRot = lerp(0.9, 2.9, ease((k - 0.6) / 0.5));
            look = k > 1.4 ? 0 : 1;
          }
        }
        if (t > 6.3 && t < 8.2) chipsOn = true;
        const blink = t % 3.1 < 0.1 && e !== "scared";
        ctx.fillStyle = "rgba(42,31,26,.18)";
        ctx.beginPath();
        ctx.ellipse(mx, 602, 60, 10, 0, 0, 7);
        ctx.fill();
        max({
          x: mx,
          y: 600,
          s: 200,
          e,
          walk,
          look,
          armA,
          batRot,
          blink,
          chips: chipsOn,
        });
        // "!" and BONK
        if (t > 8.25 && t < 10.6) {
          const k = backOut((t - 8.25) / 0.25);
          ctx.save();
          ctx.translate(mx + 100, 215);
          ctx.scale(k, k);
          ctx.font = "900 90px Inter";
          ctx.textAlign = "center";
          ctx.lineWidth = 8;
          ctx.strokeStyle = INK;
          ctx.strokeText("!", 0, 0);
          ctx.fillStyle = "#fff3d6";
          ctx.fillText("!", 0, 0);
          ctx.restore();
        }
        if (t > 10.95 && t < 12.2) {
          const k = t - 10.95;
          ctx.save();
          ctx.translate(980, 330);
          ctx.rotate(-0.15);
          const sc = backOut(k / 0.2) * (1 - clamp((k - 0.9) / 0.3, 0, 1));
          ctx.scale(sc, sc);
          const pts = [];
          for (let i = 0; i < 16; i++) {
            const r = i % 2 ? 60 : 110,
              a = (i / 16) * Math.PI * 2;
            pts.push(Math.cos(a) * r * 1.3, Math.sin(a) * r * 0.8);
          }
          poly(pts, "#f2c33a", 5);
          ctx.font = "900 54px Inter";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = INK;
          ctx.fillText("BONK", 0, 0);
          ctx.restore();
        }
        ctx.restore();
        // vignette light
        const vg = ctx.createRadialGradient(
          W / 2,
          H / 2,
          H * 0.45,
          W / 2,
          H / 2,
          H * 1.0,
        );
        vg.addColorStop(0, "rgba(0,0,0,0)");
        vg.addColorStop(1, "rgba(60,30,30,.25)");
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
        if (t < 4.3) caption("DAY 47", 0.4, t);
        else if (t < 8.2) caption("SNACKS", 4.5, t);
        else if (t < 10.6) caption("OH NO", 8.3, t);
        else caption("MINE", 11.3, t);
        let fade = 0;
        if (t < 0.3) fade = 1 - t / 0.3;
        if (t > 14.6) fade = (t - 14.6) / 0.4;
        if (fade > 0) {
          ctx.fillStyle = `rgba(0,0,0,${clamp(fade, 0, 1)})`;
          ctx.fillRect(0, 0, W, H);
        }
      }
      window.render = render;
      document.fonts.load("900 76px Inter").then(() => {
        window.ready = true;
        render(0);
      });
    </script>
  </body>
</html>
