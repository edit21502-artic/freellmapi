<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1280" height="720"></canvas>
    <script>
      const W = 1280,
        H = 720,
        cv = document.getElementById("c"),
        ctx = cv.getContext("2d"),
        INK = "#2a1f1a";
      let seed = 1;
      const srand = (s) => {
        seed = s >>> 0 || 1;
      };
      const rnd = () => {
        seed ^= seed << 13;
        seed >>>= 0;
        seed ^= seed >> 17;
        seed ^= seed << 5;
        seed >>>= 0;
        return seed / 4294967296;
      };
      const J = 1.2,
        jx = (v) => v + (rnd() - 0.5) * J;
      function hash(n) {
        n = n ^ 61 ^ (n >>> 16);
        n = n + (n << 3);
        n = n ^ (n >>> 4);
        n = Math.imul(n, 0x27d4eb2d);
        n = n ^ (n >>> 15);
        return (n >>> 0) / 4294967296;
      }
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v)),
        lerp = (a, b, t) => a + (b - a) * t;
      const ease = (t) => {
        t = clamp(t, 0, 1);
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      };
      const backOut = (t) => {
        t = clamp(t, 0, 1);
        const c = 1.7;
        return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
      };
      function L(p, w, c = INK) {
        ctx.beginPath();
        ctx.moveTo(jx(p[0]), jx(p[1]));
        for (let i = 2; i < p.length; i += 2)
          ctx.lineTo(jx(p[i]), jx(p[i + 1]));
        ctx.lineWidth = w;
        ctx.strokeStyle = c;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
      }
      function P(p, f, w, c = INK) {
        ctx.beginPath();
        ctx.moveTo(jx(p[0]), jx(p[1]));
        for (let i = 2; i < p.length; i += 2)
          ctx.lineTo(jx(p[i]), jx(p[i + 1]));
        ctx.closePath();
        if (f) {
          ctx.fillStyle = f;
          ctx.fill();
        }
        if (w) {
          ctx.lineWidth = w;
          ctx.strokeStyle = c;
          ctx.lineJoin = "round";
          ctx.stroke();
        }
      }
      function C(x, y, r, f, w, c = INK) {
        ctx.beginPath();
        ctx.arc(jx(x), jx(y), Math.max(0.4, r), 0, 7);
        if (f) {
          ctx.fillStyle = f;
          ctx.fill();
        }
        if (w) {
          ctx.lineWidth = w;
          ctx.strokeStyle = c;
          ctx.stroke();
        }
      }
      function E(x, y, rx, ry, f) {
        ctx.beginPath();
        ctx.ellipse(x, y, Math.max(0.3, rx), Math.max(0.3, ry), 0, 0, 7);
        ctx.fillStyle = f;
        ctx.fill();
      }
      function R(x, y, w, h, f, lw) {
        P([x, y, x + w, y, x + w, y + h, x, y + h], f, lw);
      }
      function G(y0, y1, c0, c1, x = 0, w = W) {
        const g = ctx.createLinearGradient(0, y0, 0, y1);
        g.addColorStop(0, c0);
        g.addColorStop(1, c1);
        ctx.fillStyle = g;
        ctx.fillRect(x, y0, w, y1 - y0);
      }
      function txt(s, x, y, sz, col, al = "center", font = "900") {
        ctx.font = `${font} ${sz}px Inter`;
        ctx.textAlign = al;
        ctx.textBaseline = "middle";
        ctx.fillStyle = col;
        ctx.fillText(s, x, y);
      }
      const PAL = {
        day: {
          sky: ["#aebcd2", "#ecd9c6"],
          bld: "#a79bb3",
          bld2: "#bfb4c8",
          win: "#d6cde0",
          ground: "#d3cac6",
          road: "#b5adb0",
          haze: "rgba(238,214,204,.34)",
          lit: 0.15,
        },
        dusk: {
          sky: ["#7f6f96", "#e9ae88"],
          bld: "#7d6f8c",
          bld2: "#9a879c",
          win: "#e8c27a",
          ground: "#b9a8a6",
          road: "#9c8f95",
          haze: "rgba(232,170,140,.3)",
          lit: 0.4,
        },
        dawn: {
          sky: ["#e9a98a", "#fbe3c0"],
          bld: "#b59aa6",
          bld2: "#cdb2b4",
          win: "#f6dca8",
          ground: "#d8c8b8",
          road: "#bfb0a8",
          haze: "rgba(255,222,186,.36)",
          lit: 0.1,
        },
        night: {
          sky: ["#0b1130", "#1f2c5c"],
          bld: "#1a2040",
          bld2: "#232b52",
          win: "#e8c27a",
          ground: "#323a5e",
          road: "#262c48",
          haze: "rgba(60,70,130,.22)",
          lit: 0.3,
          night: 1,
        },
        storm: {
          sky: ["#232733", "#4a5060"],
          bld: "#353a4b",
          bld2: "#444a5c",
          win: "#e8c27a",
          ground: "#555a68",
          road: "#444955",
          haze: "rgba(120,130,150,.22)",
          lit: 0.25,
          night: 1,
        },
      };
      let SH = null,
        TT = 0,
        LT = 0;
      // ---------- sky / city ----------
      function sky(p, t, hy = 470) {
        G(0, hy, p.sky[0], p.sky[1]);
        if (p.night) {
          srand(777);
          for (let i = 0; i < 70; i++) {
            const x = rnd() * W,
              y = rnd() * hy * 0.8;
            ctx.globalAlpha =
              (p === PAL.storm ? 0.0 : 0.35) + 0.3 * Math.sin(t * 3 + i);
            ctx.fillStyle = "#cfd6ff";
            ctx.fillRect(x, y, 1.6, 1.6);
          }
          ctx.globalAlpha = 1;
          if (p === PAL.night) {
            const g = ctx.createRadialGradient(1050, 105, 30, 1050, 105, 180);
            g.addColorStop(0, "rgba(170,180,230,.3)");
            g.addColorStop(1, "rgba(170,180,230,0)");
            ctx.fillStyle = g;
            ctx.fillRect(820, 0, 460, 320);
            srand(5 + BO);
            C(1050, 105, 38, "#cfcfcc", 3);
            C(1038, 96, 6, "#b9b9b6");
            C(1064, 116, 4, "#b9b9b6");
          } else {
            ctx.fillStyle = "rgba(20,22,30,.5)";
            for (let i = 0; i < 7; i++)
              E(
                ((i * 230 + t * 12) % 1500) - 100,
                60 + hash(i) * 120,
                190,
                46,
                "rgba(24,26,34,.55)",
              );
          }
        } else {
          C(
            1040,
            p === PAL.dusk ? 330 : 130,
            p === PAL.dusk ? 64 : 50,
            p === PAL.day ? "#fff3d6" : "#ffe2a8",
          );
          for (const [x, y, w] of [
            [200, 110, 260],
            [700, 70, 320],
            [960, 210, 240],
          ])
            E(x + Math.sin(t * 0.2) * 12, y, w / 2, 17, "rgba(255,255,255,.4)");
        }
      }
      function skyline(p, base, sd, o = {}) {
        srand(sd);
        let x = -20;
        while (x < W + 20) {
          const w = 80 + rnd() * 90,
            h = 90 + rnd() * 190;
          ctx.fillStyle = p.bld2;
          ctx.fillRect(x, base - h, w, h);
          ctx.lineWidth = 2;
          ctx.strokeStyle = "rgba(42,31,26,.55)";
          ctx.strokeRect(x, base - h, w, h);
          for (let yy = base - h + 14; yy < base - 16; yy += 22)
            for (let xx = x + 10; xx < x + w - 12; xx += 18) {
              const lit = rnd() < p.lit && !o.nolight;
              ctx.fillStyle = lit ? p.win : "rgba(0,0,0,.14)";
              ctx.fillRect(xx, yy, 8, 11);
            }
          x += w + (rnd() < 0.3 ? 14 : 0);
        }
        srand(31 + BO);
      }
      function smoke(x, base, h, t, a = 0.35) {
        ctx.fillStyle = `rgba(90,80,90,${a})`;
        ctx.beginPath();
        ctx.moveTo(x - 18, base);
        ctx.bezierCurveTo(
          x - 30,
          base - h * 0.5,
          x + 40 + Math.sin(t) * 12,
          base - h * 0.7,
          x + 70,
          base - h,
        );
        ctx.lineTo(x + 140, base - h - 10);
        ctx.bezierCurveTo(
          x + 70,
          base - h * 0.6,
          x + 22,
          base - h * 0.4,
          x + 24,
          base,
        );
        ctx.fill();
      }
      function hazeBand(p, y0, y1) {
        const g = ctx.createLinearGradient(0, y0, 0, y1);
        g.addColorStop(0, "rgba(0,0,0,0)");
        g.addColorStop(1, p.haze);
        ctx.fillStyle = g;
        ctx.fillRect(0, y0, W, y1 - y0);
      }
      // ---------- props ----------
      function car(x, y, col = "#7b9d97", sc = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(sc, sc);
        R(0, -70, 260, 52, col, 3.5);
        P([44, -70, 80, -112, 184, -112, 218, -70], col, 3.5);
        P([58, -73, 86, -106, 126, -106, 126, -73], "#d8e2e0", 2.5);
        P([136, -73, 136, -106, 178, -106, 204, -73], "#d8e2e0", 2.5);
        C(58, -16, 23, "#3a3236", 3.5);
        C(204, -16, 23, "#3a3236", 3.5);
        C(58, -16, 9, "#bdb6aa", 2);
        C(204, -16, 9, "#bdb6aa", 2);
        ctx.restore();
      }
      function van(x, y, o = {}) {
        ctx.save();
        ctx.translate(x, y);
        R(0, -150, 300, 125, "#e6dcc8", 3.5);
        P([300, -150, 360, -150, 395, -95, 395, -25, 300, -25], "#e6dcc8", 3.5);
        P([310, -140, 355, -140, 382, -97, 310, -97], "#cfe0e2", 2.5);
        if (o.heads) {
          C(338, -112, 13, "#e8c4a2", 2.5);
          ctx.beginPath();
          ctx.arc(338, -115, 14, Math.PI, 0);
          ctx.fillStyle = "#a9b0b9";
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = INK;
          ctx.stroke();
        }
        R(30, -128, 150, 50, "#c98a57", 2.5);
        txt("BAKERY", 105, -102, 24, "#f3ead2");
        L([190, -150, 190, -25], 2);
        C(70, -18, 26, "#3a3236", 3.5);
        C(320, -18, 26, "#3a3236", 3.5);
        C(70, -18, 10, "#bdb6aa", 2);
        C(320, -18, 10, "#bdb6aa", 2);
        if (o.lights) {
          ctx.fillStyle = "rgba(255,240,180,.22)";
          ctx.beginPath();
          ctx.moveTo(395, -60);
          ctx.lineTo(700, -110);
          ctx.lineTo(700, 10);
          ctx.fill();
        }
        ctx.restore();
      }
      function barricade(x, y) {
        R(x, y - 70, 150, 70, "#8a6a4a", 3);
        R(x + 30, y - 130, 110, 62, "#6f7f8f", 3);
        R(x + 120, y - 95, 120, 95, "#9c7b5a", 3);
        L([x + 10, y - 70, x + 10, y - 150, x + 70, y - 150], 4, "#5a4534");
        R(x + 150, y - 150, 70, 58, "#b0563f", 3);
        L([x + 60, y - 170, x + 200, y - 200], 5, "#5a4534");
      }
      // ---------- backgrounds: return {gy,s,far} ----------
      const BG = {};
      BG.street = (sh, t, lt) => {
        const p = PAL[sh.pal],
          o = sh.o;
        sky(p, t);
        skyline(p, 430, 11, o);
        hazeBand(p, 200, 440);
        for (const [x, h] of [
          [260, 200],
          [900, 170],
        ])
          if (sh.day > 3 || sh.day === 0) smoke(x, 430, h, t, 0.22);
        // near facades
        srand(21);
        let x = -30,
          i = 0;
        while (x < W) {
          const w = 230 + rnd() * 90,
            h = 230 + rnd() * 120,
            by = 470;
          ctx.fillStyle = p.bld;
          ctx.fillRect(x, by - h, w, h);
          for (let yy = by - h + 24; yy < by - 130; yy += 52)
            for (let xx = x + 26; xx < x + w - 40; xx += 58) {
              const lit = rnd() < p.lit && !o.nolight;
              ctx.fillStyle = lit
                ? p.win
                : p.night
                  ? "#11152c"
                  : "rgba(60,50,70,.35)";
              ctx.fillRect(xx, yy, 30, 34);
              ctx.lineWidth = 2;
              ctx.strokeStyle = "rgba(42,31,26,.6)";
              ctx.strokeRect(xx, yy, 30, 34);
            }
          const aw = ["#c0533f", "#7b9d97", "#d8b04c", "#8796a6"][i % 4];
          ctx.fillStyle = p.night ? "#161a34" : "rgba(40,34,50,.5)";
          ctx.fillRect(x + 20, by - 96, w - 110, 70);
          ctx.fillStyle = aw;
          ctx.globalAlpha = p.night ? 0.45 : 1;
          ctx.fillRect(x + 12, by - 112, w - 94, 18);
          ctx.globalAlpha = 1;
          ctx.fillStyle = p.night ? "#0f1226" : "#5a4a44";
          ctx.fillRect(x + w - 74, by - 100, 44, 100);
          ctx.lineWidth = 3;
          ctx.strokeStyle = "rgba(42,31,26,.7)";
          ctx.strokeRect(x, by - h, w, h);
          x += w;
          i++;
        }
        srand(41 + BO);
        ctx.fillStyle = p.ground;
        ctx.fillRect(0, 470, W, 70);
        L([0, 470, W, 470], 3);
        ctx.fillStyle = p.road;
        ctx.fillRect(0, 540, W, 180);
        L([0, 540, W, 540], 3);
        ctx.setLineDash([46, 34]);
        L([0, 655, W, 655], 5, p.night ? "#59608a" : "#efe6d6");
        ctx.setLineDash([]);
        const pr = o.props || [];
        if (pr.includes("bus")) {
          L([1010, 300, 1010, 540], 5);
          R(880, 300, 200, 14, "#8796a6", 3);
          R(1090, 330, 44, 44, "#3d5e8c", 3);
          txt("BUS", 1112, 352, 15, "#fff");
          R(900, 440, 150, 12, "#8a6a4a", 2.5);
        }
        if (pr.includes("car")) car(960, 600);
        if (pr.includes("van")) van(700, 585);
        if (pr.includes("ladder")) {
          for (let k = 0; k < 3; k++) {
            R(820, 150 + k * 100, 150, 10, "#3a3236", 2);
            L([830, 160 + k * 100, 950, 250 + k * 100], 4, "#3a3236");
          }
          L([965, 150, 965, 470], 4, "#3a3236");
        }
        return { gy: 614, s: 128, far: { y: 502, s: 70 } };
      };
      BG.booth = (sh, t, lt) => {
        const r = BG.street(
          Object.assign({}, sh, { o: Object.assign({}, sh.o, { props: [] }) }),
          t,
          lt,
        );
        R(700, 330, 190, 210, "#3d4466", 3.5);
        P([680, 330, 910, 330, 880, 290, 710, 290], "#c0533f", 3.5);
        R(730, 372, 90, 74, "#f3c46d", 3);
        R(836, 372, 44, 168, "#2a2f4e", 3);
        txt("TICKETS", 795, 312, 20, "#f3ead2");
        const g = ctx.createRadialGradient(775, 410, 10, 775, 410, 220);
        g.addColorStop(0, "rgba(243,196,109,.3)");
        g.addColorStop(1, "rgba(243,196,109,0)");
        ctx.fillStyle = g;
        ctx.fillRect(520, 200, 520, 440);
        if (sh.o.inside3) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(732, 374, 86, 70);
          ctx.clip();
          person({ k: "hero", x: 760, y: 520, s: 64 });
          person({ k: "riley", x: 795, y: 520, s: 64, f: -1 });
          ctx.restore();
        }
        return r;
      };
      BG.city = (sh, t) => {
        const p = PAL[sh.pal],
          o = sh.o;
        sky(p, t, 720);
        skyline(p, 520, 61, { nolight: 1 });
        hazeBand(p, 200, 520);
        ctx.save();
        ctx.translate(0, 120);
        skyline(p, 600, 62, {
          nolight: o.nolight || sh.day >= 7 || sh.day === 0,
        });
        ctx.restore();
        for (const [x, h] of [
          [180, 300],
          [520, 380],
          [880, 330],
          [1100, 260],
        ])
          smoke(x, 520, h, t, 0.3);
        ctx.fillStyle = p.night ? "#0d1128" : "#4a4250";
        ctx.fillRect(0, 650, W, 70);
        L([0, 650, W, 650], 3);
        return { gy: 700, s: 60 };
      };
      BG.roof = (sh, t) => {
        const p = PAL[sh.pal],
          o = sh.o;
        sky(p, t);
        skyline(p, 450, 71, { nolight: sh.day >= 7 });
        hazeBand(p, 220, 450);
        if (!p.night || 1)
          for (const [x, h] of [
            [240, 210],
            [840, 180],
          ])
            smoke(x, 450, h, t, 0.2);
        srand(81 + BO);
        R(-10, 432, W + 20, 46, p.night ? "#3d4466" : "#b6a9ad", 3);
        L([-10, 454, W + 10, 454], 2);
        G(
          478,
          H,
          p.night ? "#323a5e" : "#a99c9f",
          p.night ? "#262c48" : "#8e8287",
        );
        R(980, 470, 200, 115, p.night ? "#aab0c4" : "#d0d2d8", 3);
        for (let i = 0; i < 7; i++)
          L([986, 498 + i * 12, 1174, 498 + i * 12], 1.5);
        R(250, 515, 22, 70, "#9da2b8", 3);
        P([242, 517, 280, 517, 274, 502, 248, 502], "#9da2b8", 3);
        if ((o.props || []).includes("buckets"))
          for (let i = 0; i < 5; i++) {
            const bx = 560 + i * 78;
            P(
              [bx, 560, bx + 44, 560, bx + 38, 606, bx + 6, 606],
              ["#8796a6", "#c0533f", "#a9b0b9", "#d8b04c", "#7b9d97"][i],
              3,
            );
            if (o.rain) E(bx + 22, 562, 20, 4, "#9fc0dd");
          }
        if (o.throw) {
          const u = clamp((LT - 1.2) / 1.6, 0, 1);
          if (u > 0) {
            const x = lerp(560, 1330, u),
              y = lerp(380, 300, u) - Math.sin(u * Math.PI) * 190;
            ctx.setLineDash([12, 10]);
            ctx.lineWidth = 3;
            ctx.strokeStyle = "rgba(60,50,60,.7)";
            ctx.beginPath();
            for (let k = 0; k <= 30; k++) {
              const v = (u * k) / 30,
                xx = lerp(560, 1330, v),
                yy = lerp(380, 300, v) - Math.sin(v * Math.PI) * 190;
              k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
            }
            ctx.stroke();
            ctx.setLineDash([]);
            clock(x, y, 18, u * 12);
          }
        }
        return { gy: 592, s: 128 };
      };
      function clock(x, y, r, rot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        C(-r * 0.6, -r * 0.85, r * 0.35, "#d9a441", 2);
        C(r * 0.6, -r * 0.85, r * 0.35, "#d9a441", 2);
        C(0, 0, r, "#d2453a", 3);
        C(0, 0, r * 0.72, "#f2efe6", 2);
        L([0, 0, 0, -r * 0.5], 2);
        L([0, 0, r * 0.32, r * 0.1], 2);
        ctx.restore();
      }
      function room(p, lit, wall = "#cdbcae", floor = "#9c7b62") {
        ctx.fillStyle = wall;
        ctx.fillRect(0, 0, W, 560);
        ctx.fillStyle = "rgba(0,0,0,.05)";
        for (let i = 0; i < 9; i++) ctx.fillRect(i * 150 + 40, 0, 60, 560);
        G(560, H, floor, "#6e5645");
        L([0, 560, W, 560], 3);
        R(0, 540, W, 20, "#7d6452", 2);
      }
      function windowPane(x, y, w, h, p, t, o = {}) {
        R(x - 12, y - 12, w + 24, h + 24, "#6b5446", 3);
        G(y, y + h, p.sky[0], p.sky[1], x, w);
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.clip();
        ctx.translate(x - 200, y - 170);
        ctx.scale(0.75, 0.75);
        skyline(p, 560, 91, { nolight: SH.day >= 7 });
        ctx.restore();
        if (o.rain) {
          ctx.strokeStyle = "rgba(200,215,235,.5)";
          ctx.lineWidth = 1.5;
          srand(BO * 3 + 2);
          for (let i = 0; i < 30; i++) {
            const rx = x + rnd() * w,
              ry = y + rnd() * h;
            ctx.beginPath();
            ctx.moveTo(rx, ry);
            ctx.lineTo(rx - 5, ry + 16);
            ctx.stroke();
          }
        }
        L([x + w / 2, y, x + w / 2, y + h], 6, "#6b5446");
        L([x, y + h / 2, x + w, y + h / 2], 6, "#6b5446");
      }
      BG.apt = (sh, t) => {
        const p = PAL[sh.pal],
          o = sh.o,
          pr = o.props || [];
        room(p);
        windowPane(120, 130, 270, 250, p, t, { rain: sh.pal === "storm" });
        // notes on wall
        if (sh.day >= 5) {
          R(450, 150, 90, 70, "#f3ead2", 2);
          for (let i = 0; i < 4; i++)
            L([460, 165 + i * 14, 530, 165 + i * 14], 1.5);
        }
        if (sh.day >= 11) {
          R(560, 130, 130, 100, "#e8dcc0", 2);
          L([575, 210, 610, 170, 650, 190, 675, 150], 2.5, "#c0533f");
        }
        P([470, 560, 480, 455, 820, 455, 830, 560], "#7d8fa6", 3.5);
        R(455, 490, 45, 70, "#6e8098", 3);
        R(800, 490, 45, 70, "#6e8098", 3);

              ? ease(clamp(lt / Math.min(dur, 2.6), 0, 1))
              : clamp(lt / dur, 0, 1);
          const x2 = +m[4];
          x = lerp(+m[2], x2, u);
          if (u < 1) walk = lt * (m[3] === ">>" ? 14 : 7.5) + +m[2];
          f = x2 < +m[2] ? -1 : 1;
        }
        if (fl.includes("<")) f = -1;
        let y = r.gy;
        if (r.slope) y = r.slope[1] + (x - r.slope[0]) / r.slope[2];
        return {
          k: m[1],
          x,
          y,
          s: r.s,
          f,
          walk,
          scared: fl.includes("!"),
          arm: fl.includes("^") ? "up" : null,
          item: m[6],
        };
      }
      function drawZ(sh, t, lt, r) {
        const o = sh.o;
        const list = [];
        if (o.z && !r.noz) {
          const R0 = o.zfar
              ? r.far || { y: r.gy - 90, s: r.s * 0.6 }
              : o.zmid
                ? r.mid
                : { y: r.gy, s: r.s },
            zr = o.zr || [R0.x0 || 40, R0.x1 || W - 40],
            zm = o.zm == null ? -10 : o.zm;
          for (let i = 0; i < o.z; i++) {
            let x =
              zr[0] +
              hash(i * 7 + sh.i) * (zr[1] - zr[0]) +
              zm * lt * (0.7 + hash(i + 3) * 0.6) * (o.zfar ? 0.4 : 1);
            let y = R0.y + (hash(i * 5 + 1) - 0.5) * (o.zfar ? 14 : 34);
            if (r.slope) y = r.slope[1] + (x - r.slope[0]) / r.slope[2];
            list.push({
              k: "z",
              x,
              y,
              s: R0.s * (0.92 + hash(i + 11) * 0.16),
              f: zm > 0 ? 1 : zm < 0 ? -1 : hash(i) > 0.5 ? 1 : -1,
              walk: zm ? lt * 4 + i * 1.7 : null,
              ci: i,
            });
          }
        }
        if (o.c) {
          for (let i = 0; i < o.c; i++) {
            const cm = o.cm || 0;
            let x =
              80 +
              hash(i * 9 + 2) * (W - 160) +
              cm * lt * (hash(i) > 0.5 ? 1 : -1) * 2.2;
            if (o.cphone && Math.abs(x - 640) < 120) x += x < 640 ? -140 : 140;
            list.push({
              k: "civ",
              x,
              y: r.gy + (hash(i * 3) - 0.5) * 30 - (o.cphone ? 0 : 20),
              s: r.s * (0.95 + hash(i + 4) * 0.1),
              f: o.cphone ? (x < 640 ? 1 : -1) : hash(i) > 0.5 ? 1 : -1,
              walk: cm ? lt * 7 + i : null,
              ci: i,
              arm: o.cphone ? "fwd" : null,
              item: o.cphone ? "phone" : null,
            });
          }
        }
        (o.a || []).forEach((a, i) => {
          const pa = parseA(a, lt, sh.dur, r);
          pa.ci = i + 2;
          if (
            o.talk === pa.k &&
            lt > sh.words[0][1] &&
            lt < sh.words[sh.words.length - 1][2]
          )
            pa.talk = 1;
          if (pa.k === "hero" && sh.i === 7) pa.item = "cup";
          list.push(pa);
        });
        list.sort((a, b) => a.y - b.y);
        for (const pz of list) {
          shadow(pz.x, pz.y, pz.s);
          person(pz);
        }
        return list;
      }
      function rain(t) {
        ctx.strokeStyle = "rgba(200,215,235,.45)";
        ctx.lineWidth = 2;
        srand(BO * 5 + 1);
        for (let i = 0; i < 140; i++) {
          const x = rnd() * 1400 - 60,
            y = rnd() * H;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - 14, y + 44);
          ctx.stroke();
        }
        srand(BO);
      }
      // ---------- subtitles ----------
      function subs(sh, lt) {
        const ws = sh.words;
        if (lt < ws[0][1] - 0.05 || lt > ws[ws.length - 1][2] + 0.35) return;
        const ch = [];
        let cur = [];
        for (const w of ws) {
          cur.push(w);
          if (cur.length >= 5 || (/[.,?!]$/.test(w[0]) && cur.length >= 2)) {
            ch.push(cur);
            cur = [];
          }
        }
        if (cur.length) {
          if (cur.length < 2 && ch.length) ch[ch.length - 1].push(...cur);
          else ch.push(cur);
        }
        let c =
          ch.find((c) => lt < c[c.length - 1][2] + 0.02) || ch[ch.length - 1];
        ctx.font = "900 50px Inter";
        const sp = 14,
          wd = c.map((w) => ctx.measureText(w[0].toUpperCase()).width),
          tot = wd.reduce((a, b) => a + b, 0) + sp * (c.length - 1);
        const fit = Math.min(1, 1160 / tot),
          pop = 1 + 0.05 * Math.max(0, 1 - (lt - c[0][1]) / 0.12);
        ctx.save();
        ctx.translate(640, 648);
        ctx.scale(fit * pop, fit * pop);
        let x = -tot / 2;
        const col = sh.sp === "ELI" || sh.sp === "HERO" ? "#ffffff" : "#ffe27a";
        c.forEach((w, i) => {
          const s = w[0].toUpperCase(),
            on = lt >= w[1];
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.lineJoin = "round";
          ctx.shadowColor = "rgba(255,170,200,.75)";
          ctx.shadowBlur = 18;
          ctx.lineWidth = 11;
          ctx.strokeStyle = "#17110f";
          ctx.strokeText(s, x, 0);
          ctx.shadowBlur = 0;
          ctx.fillStyle = on ? col : "rgba(255,255,255,.55)";
          ctx.fillText(s, x, 0);
          x += wd[i] + sp;
        });
        ctx.restore();
      }
      function dayTag(sh, t) {
        if (!sh.day) return;
        const first = TL.shots.find((s) => s.day === sh.day),
          k = t - first.start,
          sc = 1 + 0.5 * Math.max(0, 1 - k / 0.35);
        ctx.save();
        ctx.translate(40, 50);
        ctx.scale(sc, sc);
        ctx.font = "900 40px Inter";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.lineJoin = "round";
        ctx.lineWidth = 10;
        ctx.strokeStyle = "#17110f";
        ctx.strokeText("DAY " + sh.day, 0, 0);
        ctx.fillStyle = "#e7432f";
        ctx.fillText("DAY " + sh.day, 0, 0);
        ctx.restore();
        ctx.fillStyle = "rgba(23,17,15,.6)";
        ctx.fillRect(40, 82, 150, 7);
        ctx.fillStyle = "#e7432f";
        ctx.fillRect(40, 82, (150 * sh.day) / 30, 7);
      }
      // ---------- main ----------
      let TL = null,
        BO = 0;
      function render(t) {
        TT = t;
        BO = Math.floor(t * 8);
        let sh = TL.shots[0];
        for (const s of TL.shots) {
          if (t >= s.start) sh = s;
          else break;
        }
        SH = sh;
        sh._glow = null;
        const lt = clamp(t - sh.start, 0, sh.dur),
          u = lt / sh.dur,
          o = sh.o;
        LT = lt;
        srand(1000 + BO * 7919);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        let z =
            o.cam === "in"
              ? lerp(1, 1.12, ease(u))
              : o.cam === "out"
                ? lerp(1.12, 1, ease(u))
                : lerp(1.02, 1.05, u),
          sx = 0,
          sy = 0;
        if (o.shake && lt < 1.4) {
          const a = 14 * (1 - lt / 1.4);
          sx = (rnd() - 0.5) * a;
          sy = (rnd() - 0.5) * a;
        }
        ctx.translate(W / 2 + sx, H * 0.55 + sy);
        ctx.scale(z, z);
        ctx.translate(-W / 2, -H * 0.55);
        const r = BG[sh.bg](sh, t, lt);
        const list = drawZ(sh, t, lt, r);
        if (o.rain && sh.bg !== "window") rain(t);
        let dark = o.dark || 0;
        if (o.darkin) {
          dark = lt > 1.0 ? o.darkin : 0;
        }
        if (dark) {
          ctx.fillStyle = `rgba(8,8,26,${dark})`;
          ctx.fillRect(-50, -50, W + 100, H + 100);
        }
        if (sh._glow) {
          ctx.fillStyle = sh._glow[0];
          ctx.fillRect(...sh._glow.slice(1));
        }
        if (o.cone) {
          const h = list.find((p) => p.item === "flash");
          if (h) {
            const hx = h.x + 0.3 * h.s,
              hy = h.y - 1.86 * h.s;
            ctx.fillStyle = "rgba(2,2,10,.66)";
            ctx.beginPath();
            ctx.rect(-50, -50, W + 100, H + 100);
            ctx.moveTo(hx, hy - 10);
            ctx.lineTo(hx + 900, hy - 190);
            ctx.lineTo(hx + 900, hy + 420);
            ctx.lineTo(hx, hy + 20);
            ctx.fill("evenodd");
            const g = ctx.createLinearGradient(hx, 0, hx + 800, 0);
            g.addColorStop(0, "rgba(255,240,190,.22)");
            g.addColorStop(1, "rgba(255,240,190,0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(hx, hy - 10);
            ctx.lineTo(hx + 900, hy - 190);
            ctx.lineTo(hx + 900, hy + 420);
            ctx.lineTo(hx, hy + 20);
            ctx.fill();
            ctx.save();
            ctx.globalAlpha = 0.5;
            for (const p of list) if (p.x < hx) person(p);
            ctx.restore();
          }
        }
        if (o.flash) {
          const ft = [0.15, 0.32, 2.4].map((a) =>
            Math.max(0, 1 - Math.abs(lt - a) / 0.09),
          );
          const f = Math.max(...ft);
          if (f > 0) {
            ctx.fillStyle = `rgba(235,240,255,${0.7 * f})`;
            ctx.fillRect(-50, -50, W + 100, H + 100);
          }
        }
        ctx.restore();
        const vg = ctx.createRadialGradient(
          W / 2,
          H / 2,
          H * 0.4,
          W / 2,
          H / 2,
          H * 0.98,
        );
        vg.addColorStop(0, "rgba(0,0,0,0)");
        vg.addColorStop(1, "rgba(12,6,20,.5)");
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
        srand(BO * 13 + 5);
        ctx.globalAlpha = 0.045;
        for (let i = 0; i < 500; i++) {
          ctx.fillStyle = rnd() > 0.5 ? "#fff" : "#000";
          ctx.fillRect(rnd() * W, rnd() * H, 2, 2);
        }
        ctx.globalAlpha = 1;
        dayTag(sh, t);
        subs(sh, lt);
        let fade = 0;
        if (lt < 0.14) fade = 0.55 * (1 - lt / 0.14);
        if (t < 0.12) fade = 1 - t / 0.12;
        if (t > TL.total - 1) fade = clamp((t - (TL.total - 1)) / 0.9, 0, 1);
        if (fade > 0) {
          ctx.fillStyle = `rgba(0,0,0,${fade})`;
          ctx.fillRect(0, 0, W, H);
        }
      }
      window.setTL = (tl) => {
        TL = tl;
      };
      window.render = render;
      document.fonts.load("900 50px Inter").then(() => {
        window.ready = true;
      });
    </script>
  <script src="ext.js"></script>
</body>
</html>
